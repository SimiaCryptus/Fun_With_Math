        if (ed.dataset.id === it.id && ed.contains(document.activeElement) && document.activeElement.tagName === "TEXTAREA") {
            ed.querySelector(".preview").innerHTML = renderMarkdown(it.content);
            return; // keep caret
        }
        ed.dataset.id = it.id;
        const ta = h("textarea", {"aria-label": "Note content (Markdown)"});
        ta.value = it.content;
        ta.addEventListener("input", () => commit(D => {
            const x = D.items.find(y => y.id === it.id);
            x.content = ta.value;
            x.modified = now();
        }, {coalesceKey: "edit:" + it.id}));
        const dims = doc.dimensions.map(d => d.kind === "date"
            ? h("div", {class: "dimrow"}, h("b", {}, d.name + ": "), itemBucket(d, it) || "—",
                h("span", {class: "muted"}, ` (from ${d.source || "created"})`))
            : h("div", {class: "dimrow"}, h("b", {}, d.name + ": "),
                d.values.map(val => h("label", {}, h("input", {
                    type: "checkbox", checked: (it.coords[d.id] || []).includes(val.id),
                    onchange: e => commit(D => {
                        const x = D.items.find(y => y.id === it.id);
                        let s = x.coords[d.id] || [];
                        s = e.target.checked ? [...s, val.id] : s.filter(v => v !== val.id);
                        if (s.length) x.coords[d.id] = s; else delete x.coords[d.id];
                    })
                }), " " + val.label)),
                h("button", {onclick: () => addValue(d.id)}, "+")));
        // placements in the current view (§10.5)
        const placements = [];
        if (lastProj) {
            const v = activeView();
            for (const r of lastProj.rowKeys) for (const c of lastProj.colKeys) {
                const hit = lastProj.cell(r, c).find(x => x.item.id === it.id);
                if (hit) placements.push(h("li", {},
                    [v.rows.length ? headerLabel(v.rows, r) : null, v.cols.length ? headerLabel(v.cols, c) : null]
                        .filter(Boolean).join(" × ") || "(all)",
                    hit.primary ? "" : h("span", {class: "muted"}, " (echo)")));
            }
        }
        ed.replaceChildren(
            h("div", {}, h("button", {
                    onclick: () => {
                        selectedId = null;
                        render();
                    }
                }, "✕ close"), " ",
                h("button", {onclick: () => deleteItem(it.id)}, "Delete note")),
            h("p", {}, ta),
            h("div", {class: "preview", html: renderMarkdown(it.content)}),
            h("h4", {}, "Coordinates"), dims,
            h("h4", {}, "Placements in this view"),
            placements.length ? h("ul", {}, placements)
                : h("p", {class: "muted"}, "Not visible in this view (filtered, searched or unassigned hidden)."),
            h("p", {class: "muted"}, `Created ${new Date(it.created).toLocaleString()} · modified ${new Date(it.modified).toLocaleString()}`));
    }

    // ---- file I/O ----
    function download(name, text, type) {
        const a = h("a", {href: URL.createObjectURL(new Blob([text], {type})), download: name});
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function embedJSON(d) {
        return JSON.stringify(d).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");
    }

    async function saveHTML() {
        commit(D => {
            D.savedAt = now();
            D.savedRev = D.rev + 1; // commit increments rev after the mutator
        });
        flush();
        const html = PRISTINE.replace(/(<script type="application\/json" id="rotor-data">)[\s\S]*?(<\/script>)/,
            (m, a, b) => a + embedJSON(doc) + b);
        const name = doc.title.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-") + ".rotor.html";
        try {
            if (window.showSaveFilePicker) {
                lastSaveFile ||= await showSaveFilePicker({
                    suggestedName: name,
                    types: [{description: "Rotor notebook", accept: {"text/html": [".html"]}}]
                });
                const w = await lastSaveFile.createWritable();
                await w.write(html);
                await w.close();
            } else download(name, html, "text/html");
            announce("Saved.");
        } catch (e) {
            if (e.name !== "AbortError") {
                download(name, html, "text/html");
            }
        }
    }

    // ---- wiring ----
    $("#viewSel").onchange = e => switchView(e.target.value);

    function newView(name, duplicate) {
        const v = duplicate ? clone(activeView())
            : {rows: [], cols: [], pages: {}, options: {showEmpty: true, showUnassigned: true}};
        v.id = uid("w");
        v.name = name;
        doc.views.push(v);
        switchView(v.id);
    }

    $("#viewNew").onclick = () => {
        const n = prompt("View name", "New view");
        if (n) newView(n, true);
    };
    $("#viewRen").onclick = () => {
        const n = prompt("Rename view", activeView().name);
        if (n) setView(v => v.name = n);
    };
    $("#viewDel").onclick = () => {
        if (doc.views.length < 2) return alert("Keep at least one view");
        doc.views = doc.views.filter(v => v.id !== doc.activeView);
        doc.activeView = doc.views[0].id;
        navBack = [];
        navFwd = [];
        persist();
        render();
    };
    $("#transpose").onclick = () => setView(v => [v.rows, v.cols] = [v.cols, v.rows]);
    $("#undo").onclick = undo;
    $("#redo").onclick = redo;

    function addDim(n) {
        n = (n || "").trim();
        if (!n) return;
        if (doc.dimensions.some(d => d.name.toLowerCase() === n.toLowerCase())) return alert("Name in use");
        commit(D => D.dimensions.push({id: uid("d"), name: n, kind: "categorical", values: []}));
    }

    $("#dimAdd").onclick = () => addDim(prompt("Dimension name (e.g. Person)"));
    $("#docTitle").ondblclick = () => {
        const n = prompt("Notebook title", doc.title);
        if (n) commit(D => D.title = n);
    };
    $("#search").oninput = e => {
        searchTerm = e.target.value;
        renderGrid();
    };
    $("#save").onclick = saveHTML;
    $("#export").onclick = () => download("notebook.rotor.json", JSON.stringify(doc, null, 2), "application/json");
    $("#import").onclick = () => $("#importFile").click();
    $("#importFile").onchange = async e => {
        const f = e.target.files[0];
        if (!f) return;
        try {
            doc = migrate(JSON.parse(await f.text()));
            undoStack = [];
            redoStack = [];
            selectedId = null;
            persist();
            render();
        } catch (err) {
            alert("Import failed: " + err.message);
        }
        e.target.value = "";
    };
    $("#empty").onclick = () => {
        if (confirm("Start a new empty notebook? (The current one stays in browser storage.)")) {
            flush();
            doc = emptyDoc();
            undoStack = [];
            redoStack = [];
            selectedId = null;
            persist();
            render();
        }
    };
    $("#capture").addEventListener("keydown", e => {
        if (e.key !== "Enter" || !e.target.value.trim()) return;
        const text = e.target.value;
        let newId;
        commit(D => {
            const {content, coords} = parseCapture(D, text);
            const v = D.views.find(w => w.id === D.activeView);
            for (const [d, sel] of Object.entries(v.pages)) if (sel.length === 1 && !coords[d] && !isDate(D, d)) coords[d] = [sel[0]];
            newId = uid("i");
            D.items.push({id: newId, content, coords, created: now(), modified: now()});
        });
        e.target.value = "";
        announce("Captured.");
    });
    // ---- command palette (§10.7) ----
    const findDim = s => {
        s = (s || "").trim().toLowerCase();
        return s && doc.dimensions.find(d => d.name.toLowerCase().startsWith(s));
    };

    function placeDim(a, shelf) {
        const d = findDim(a);
        if (!d) return announce("No dimension “" + a + "”");
        moveDim(d.id, shelf, Infinity);
    }

    function filterCmd(a) {
        const [dn, ...rest] = (a || "").trim().split(/\s+/), d = findDim(dn);
        if (!d) return announce("No dimension “" + dn + "”");
        const lbl = rest.join(" ").toLowerCase(),
            val = lbl && valueObjs(doc, d.id).find(x => x.label.toLowerCase().startsWith(lbl));
        setView(w => {
            w.rows = w.rows.filter(x => x !== d.id);
            w.cols = w.cols.filter(x => x !== d.id);
            w.pages[d.id] = val ? [val.id] : (w.pages[d.id] || []);
        });
    }

    const COMMANDS = [
        ["rotate", "Transpose rows and columns", () => $("#transpose").click()],
        ["rows", "rows <dim> — put a dimension on rows", a => placeDim(a, "Rows")],
        ["cols", "cols <dim> — put a dimension on columns", a => placeDim(a, "Columns")],
        ["filter", "filter <dim> [value] — slice the view", filterCmd],
        ["unused", "unused <dim> — take a dimension off the view", a => placeDim(a, "Unused")],
        ["view new", "view new [name]", a => newView(a || "New view", false)],
        ["view duplicate", "view duplicate [name]", a => newView(a || activeView().name + " copy", true)],
        ["view rename", "view rename <name>", a => a ? setView(v => v.name = a) : $("#viewRen").click()],
        ["view delete", "Delete the current view", () => $("#viewDel").click()],
        ["dim add", "dim add <name>", a => a ? addDim(a) : $("#dimAdd").click()],
        ["dim delete", "dim delete <dim> — remove a dimension (notes kept)", a => {
            const d = findDim(a);
            d ? deleteDim(d.id) : announce("No dimension “" + a + "”");
        }],
        ["dim kind", "dim kind <dim> <categorical|ordinal|date> [day|week|month|quarter|year]", a => {
            const [dn, k, g] = (a || "").trim().split(/\s+/), d = findDim(dn);
            d ? setKind(d.id, (k || "").toLowerCase(), (g || "").toLowerCase() || undefined) : announce("No dimension “" + dn + "”");
        }],
        ["dim gran", "dim gran <dim> <day|week|month|quarter|year> — date bucket size", a => {
            const [dn, g] = (a || "").trim().split(/\s+/), d = findDim(dn);
            if (!d) return announce("No dimension “" + dn + "”");
            if (d.kind !== "date") return announce(d.name + " is not a date dimension");
            setKind(d.id, "date", (g || "").toLowerCase());
        }],
        ["mode", "mode <stack|list|count> — cell display", a => {
            const m = (a || "").trim().toLowerCase();
            if (["stack", "list", "count"].includes(m)) setView(w => w.options.cellMode = m);
            else announce("Mode must be stack, list or count");
        }],
        ["sort", "sort <created|modified|alpha> — order within cells", a => {
            const s = (a || "").trim().toLowerCase();
            if (["created", "modified", "alpha"].includes(s)) setView(w => w.options.sort = s);
            else announce("Sort must be created, modified or alpha");
        }],
        ["back", "Previous view state (Alt+←)", () => navGo(-1)],
        ["forward", "Next view state (Alt+→)", () => navGo(1)],
        ["undo", "Undo", undo], ["redo", "Redo", redo],
        ["save", "Save as self-contained HTML", saveHTML],
        ["export json", "Download rotor.json", () => $("#export").click()],
        ["import", "Import a rotor.json file", () => $("#import").click()],
        ["empty", "Toggle showing empty rows/columns", () => setView(w => w.options.showEmpty = !w.options.showEmpty)],
        ["unassigned", "Toggle the — bucket", () => setView(w => w.options.showUnassigned = !w.options.showUnassigned)],
        ["snapshots", "Restore a recoverable snapshot of this notebook", restoreSnapshot],
        ["snapshot", "Take a snapshot of the current notebook now", () => {
            snapshot(doc);
            announce("Snapshot taken.");
        }],
        ["expand", "Render all rows, ignoring the 2,000-cell cap (this session)", () => {
            capLifted = true;
            renderGrid();
        }],
        ["persist", "Ask the browser to keep storage from eviction", async () => {
            try {
                const ok = await navigator.storage?.persist?.();
                announce(ok ? "Storage is persistent." : "Browser declined persistent storage — save to file regularly.");
                status(ok ? "storage persistent ✓" : "⚠ storage may be evicted — save to file");
            } catch {
                announce("Persistent storage not supported here.");
            }
        }],
    ];
    let palSel = 0, palPrev = null;
    const fuzzy = (q, s) => {
        let i = 0;
        for (const ch of s) if (ch === q[i]) i++;
        return i === q.length;
    };

    function palMatches() {
        const q = $("#palIn").value.replace(/^\//, "").trimStart().toLowerCase();
        const exact = [...COMMANDS].sort((a, b) => b[0].length - a[0].length)
            .find(c => q === c[0] || q.startsWith(c[0] + " "));
        if (exact) return [{
            cmd: exact,
            arg: $("#palIn").value.replace(/^\//, "").trimStart().slice(exact[0].length).trim()
        }];
        return COMMANDS.filter(c => fuzzy(q.replace(/\s+/g, ""), c[0].replace(/\s+/g, ""))).map(cmd => ({
            cmd,
            arg: ""
        }));
    }

    function palRender() {
        const m = palMatches();
        palSel = Math.min(palSel, Math.max(0, m.length - 1));
        $("#palList").replaceChildren(...m.map((x, i) => h("li", {
            class: i === palSel ? "act" : "", role: "option",
            onmousedown: e => {
                e.preventDefault();
                palSel = i;
                palRun();
            }
        },
            "/" + x.cmd[0], h("span", {class: "muted"}, x.cmd[1]))));
    }

    function palOpen(prefix = "") {
        palPrev = document.activeElement;
        $("#palette").classList.add("open");
        $("#palIn").value = prefix;
        palSel = 0;
        palRender();
        $("#palIn").focus();
    }

    function palClose() {
        $("#palette").classList.remove("open");
        palPrev?.focus?.();
    }

    function palRun() {
        const m = palMatches()[palSel];
        palClose();
        if (m) m.cmd[2](m.arg);
    }

    $("#palIn").addEventListener("input", () => {
        palSel = 0;
        palRender();
    });
    $("#palIn").addEventListener("keydown", e => {
        e.stopPropagation();
        if (e.key === "Escape") {
            e.preventDefault();
            palClose();
        } else if (e.key === "Enter") {
            e.preventDefault();
            palRun();
        } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            const n = palMatches().length;
            if (n) palSel = (palSel + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
            palRender();
        } else if (e.key === "Tab") {
            e.preventDefault();
            const m = palMatches()[palSel];
            if (m) {
                $("#palIn").value = m.cmd[0] + " ";
                palRender();
            }
        }
    });
    $("#palette").addEventListener("mousedown", e => {
        if (e.target.id === "palette") palClose();
    });

    document.addEventListener("keydown", e => {
        const mod = e.ctrlKey || e.metaKey, typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if (mod && e.key.toLowerCase() === "k") {
            e.preventDefault();
            palOpen();
        } else if (!typing && !mod && e.key === "/") {
            e.preventDefault();
            palOpen();
        } else if (e.altKey && !mod && !typing && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
            e.preventDefault();
            navGo(e.key === "ArrowLeft" ? -1 : 1);
        } else if (mod && e.key.toLowerCase() === "z" && !typing) {
            e.preventDefault();
            e.shiftKey ? redo() : undo();
        } else if (mod && e.key.toLowerCase() === "t") {
            e.preventDefault();
            $("#transpose").click();
        } else if (mod && e.key.toLowerCase() === "s") {
            e.preventDefault();
            saveHTML();
        } else if (e.key === "Escape") {
            selectedId = null;
            render();
        } else if (!typing && !mod && e.key.toLowerCase() === "n") {
            e.preventDefault();
            $("#capture").focus();
        } else if (!typing && !mod && /^[1-9]$/.test(e.key) && doc.views[+e.key - 1]) switchView(doc.views[+e.key - 1].id);
    });

    boot();
</script>
</body>
</html>
