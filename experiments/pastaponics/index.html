<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PTRS Lattice Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; --bg:#0f1316; --panel:#171c21; --line:#2a323a; --fg:#d8dee5; --muted:#8a96a3; --accent:#5fd3a6; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font: 13px/1.4 system-ui, sans-serif; }
    body { display:flex; }
    #panel { width:370px; flex:none; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); padding:10px 12px 40px; }
    #stage { flex:1; position:relative; min-width:0; }
    #view { width:100%; height:100%; display:block; }
    #hud { position:absolute; left:10px; bottom:10px; color:var(--muted); font-size:12px; pointer-events:none; white-space:pre-wrap; }
    h1 { font-size:15px; margin:4px 0 10px; color:var(--accent); }
    details { border:1px solid var(--line); border-radius:6px; margin-bottom:8px; }
    summary { cursor:pointer; padding:6px 8px; font-weight:600; background:#1d242b; border-radius:6px; }
    details[open] summary { border-bottom:1px solid var(--line); border-radius:6px 6px 0 0; }
    .body { padding:8px; display:grid; grid-template-columns: 1fr 1fr; gap:6px 8px; }
    .body.one { grid-template-columns: 1fr; }
    .span2 { grid-column: 1 / -1; }
    label.f { display:flex; flex-direction:column; gap:2px; font-size:11.5px; color:var(--muted); }
    label.f > span:first-child { white-space:nowrap; }
    label.f input, label.f select { width:100%; background:#0f1316; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 5px; font-size:12px; }
    label.chk { display:flex; align-items:center; gap:6px; color:var(--fg); font-size:12px; }
    input[type=range] { padding:0 !important; }
    button { background:#232b33; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:5px 9px; cursor:pointer; font-size:12px; }
    button:hover { border-color:var(--accent); }
    button.primary { background:var(--accent); color:#06231a; font-weight:600; }
    .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .channel { border:1px solid var(--line); border-radius:6px; padding:6px; margin-bottom:6px; }
    .channel .head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
    .channel .head input[type=color] { width:26px; height:22px; padding:0; border:none; background:none; }
    .channel .head input[type=text] { flex:1; background:#0f1316; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:3px 5px; }
    .channel .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:4px 6px; }
    table { width:100%; border-collapse:collapse; font-size:11.5px; }
    th, td { text-align:left; padding:2px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
    td.num, th.num { text-align:right; white-space:nowrap; }
    tr.sel td { background:#24303a; }
    .ok { color:#5fd3a6; } .bad { color:#ff6b6b; } .warn { color:#ffb347; }
    pre.err { color:#ff6b6b; white-space:pre-wrap; margin:0; }
    .muted { color:var(--muted); }
    .swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; }
    ul.warn { margin:6px 0 0; padding-left:16px; color:#ffb347; }
    ul.pf { margin:6px 0 0; padding-left:16px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <aside id="panel"></aside>
  <main id="stage"><canvas id="view"></canvas><div id="hud">generating…</div></main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
