<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Point-CAD demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: #eef0f3; }
    header { display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: #fff; border-bottom: 1px solid #d9dde3; }
    header h1 { font-size: 16px; margin: 0 auto 0 0; }
    point-cad { display: block; height: calc(100vh - 46px - 120px); }
    #log { height: 120px; overflow: auto; margin: 0; padding: 6px 16px; font: 12px ui-monospace, Menlo, Consolas, monospace; background: #1d2026; color: #cfd3d9; box-sizing: border-box; }
    button { font: inherit; padding: 4px 10px; }
  </style>
  <script type="module" src="../index.js"></script>
</head>
<body>
  <header>
    <h1>Point-CAD — parametric 3D point sketcher</h1>
    <button id="solve">Solve</button>
    <button id="load">Reload truss</button>
    <button id="export-json">Export JSON</button>
    <button id="export-pcad">Export .pcad</button>
    <label><input type="checkbox" id="dark" /> dark</label>
  </header>

  <point-cad id="cad" src="./truss.pcad" panels="variables,points,constraints,script,solve"></point-cad>
  <pre id="log"></pre>

  <script type="module">
    const el = document.getElementById("cad");
    const log = document.getElementById("log");
    const say = (s) => { log.textContent += s + "\n"; log.scrollTop = log.scrollHeight; };

    el.addEventListener("pointcad:solve", (e) => {
      const r = e.detail.result;
      say(`solve: converged=${r.converged} iterations=${r.iterations} residual=${r.residualNorm.toExponential(3)} dof=${JSON.stringify(r.dof)}`);
    });
    el.addEventListener("pointcad:error", (e) => say(`error [${e.detail.kind}]: ${JSON.stringify(e.detail.detail)}`));
    el.addEventListener("pointcad:exec", (e) => say(`exec: ${e.detail.ops.length} op(s)`));
    el.addEventListener("pointcad:change", (e) => { if (["set", "script"].includes(e.detail.reason)) say(`change: ${e.detail.reason}`); });

    // Fallback when the page is opened from file:// and fetch() is blocked.
    const FALLBACK = `space euclidean3
units mm deg
var beamLength = 120 locked
var theta = 30
point A at (0, 0, 0) fixed
point B at (100, 0, 0)
point C at (100, 80, 0)
point D at (0, 0, 50) label "ridge"
distance A B = 100
distance B C = beamLength
distance A C -> min
distance A D -> max weight 0.5
angle A B C = 90
angle B C D = theta weight 2 note "roof pitch"
view camera (300, 250, 400) target (50, 40, 20) up (0, 0, 1) perspective
`;
    el.addEventListener("pointcad:error", (e) => { if (e.detail.kind === "load") el.fromScript(FALLBACK); }, { once: true });

    document.getElementById("solve").onclick = () => el.solve();
    document.getElementById("load").onclick = () => el.setAttribute("src", "./truss.pcad?" + Date.now());
    document.getElementById("export-json").onclick = () => download("sketch.json", JSON.stringify(el.toJSON(), null, 2));
    document.getElementById("export-pcad").onclick = () => download("sketch.pcad", el.toScript());
    document.getElementById("dark").onchange = (e) => el.setAttribute("theme", e.target.checked ? "dark" : "light");

    function download(name, text) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }
   say("ready — orbit: drag · pan: right/shift-drag · zoom: wheel (to cursor) / ctrl-drag / pinch · dbl-click: focus point or fit · keys: arrows ± F R 0 1 3 7 5 · toolbar toggles the tool windows");
  </script>
</body>
</html>
