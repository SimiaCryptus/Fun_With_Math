<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text Block · embedding tests</title>
  <style>
    body { background: #020805; color: #00ff66; font: 13px/1.5 ui-monospace, monospace; padding: 1rem; }
    .pass { color: #39ff88; }
    .fail { color: #ff6b5f; }
  </style>
</head>
<body>
  <h1>embedding tests</h1>
  <pre id="out">running…</pre>
  <script type="module">
    import { createChars, applyEdit, ringOf } from '../src/ring.js';
    import { computeSA, computeLCP, ringCodes } from '../src/sort.js';
    import { buildGraph } from '../src/embed/graph.js';
    import { Embedder } from '../src/embed/embedder.js';
    import { effectiveRank, knnPurity, ringSmoothness, boundarySignal } from '../src/embed/metrics.js';
    import { procrustes } from '../src/embed/linalg.js';
    import { DEFAULT_PARAMS, PRESETS } from '../src/embed/params.js';
    import { mulberry32 } from '../src/embed/rng.js';

    const results = [];
    function test(name, fn) {
      try {
        const note = fn();
        results.push({ name, ok: true, note });
      } catch (e) {
        results.push({ name, ok: false, note: e.message });
        console.error(name, e);
      }
    }
    function assert(cond, msg) { if (!cond) throw new Error(msg); }

    function envFromChars(chars, { sentinel = true, preset = 'context', ...extra } = {}) {
      const ring = ringOf(chars, sentinel);
      const n = chars.length ? ring.length : 0;
      const sa = n ? computeSA(chars, { sentinel }) : new Int32Array(0);
      const codes = n ? ringCodes(chars, sentinel) : new Int32Array(0);
      const lcp = computeLCP(codes, sa);
      const params = { ...DEFAULT_PARAMS, ...PRESETS[preset], ...extra };
      const graph = buildGraph({ sa, lcp, n, params, codes });
      return { chars, ring: n ? ring : [], codes, sa, lcp, n, graph, params };
    }
    const env = (text, opts) => envFromChars(createChars(text), opts);

    function makeEmbedder(e, overrides = {}) {
      const params = { ...e.params, ...overrides };
      const emb = new Embedder({ dim: params.dim, seed: params.seed });
      emb.setParams(params);
      emb.sync(e.ring.map((c) => c.id), e.codes);
      emb.setGraph(e.graph);
      return emb;
    }

    function bruteLCP(codes, sa) {
      const n = sa.length;
      const out = new Int32Array(n);
      for (let i = 1; i < n; i++) {
        const a = sa[i - 1];
        const b = sa[i];
        let h = 0;
        while (h < n && codes[(a + h) % n] === codes[(b + h) % n]) h++;
        out[i] = h;
      }
      return out;
    }

    test('computeLCP matches brute force (random strings, ± sentinel)', () => {
      const rand = mulberry32(42);
      let cases = 0;
      const fixed = ['abab', 'aaaa', 'abracadabra', 'mississippi', 'a', 'ab'];
      for (let t = 0; t < 300 + fixed.length; t++) {
        let s = fixed[t];
        if (s === undefined) {
          const len = 1 + Math.floor(rand() * 30);
          const alpha = 'abc'.slice(0, 1 + Math.floor(rand() * 3));
          s = Array.from({ length: len }, () => alpha[Math.floor(rand() * alpha.length)]).join('');
        }
        for (const sentinel of [false, true]) {
          const chars = createChars(s);
          const codes = ringCodes(chars, sentinel);
          const sa = computeSA(chars, { sentinel });
          const got = computeLCP(codes, sa);
          const want = bruteLCP(codes, sa);
          for (let i = 0; i < sa.length; i++) assert(got[i] === want[i], `"${s}" sentinel=${sentinel} i=${i}: ${got[i]} ≠ ${want[i]}`);
          cases++;
        }
      }
      return `${cases} cases`;
    });

    test('buildGraph: symmetric, zero diagonal, non-negative', () => {
      for (const text of ['abracadabra', 'mississippi river', 'abab', 'to be or not to be']) {
        for (const preset of ['context', 'substitution', 'ring']) {
          for (const cyclicRows of [false, true]) {
            for (const sentinel of [false, true]) {
              const { graph: g, n } = env(text, { preset, cyclicRows, sentinel, lcpGate: preset === 'context' ? 'hard' : PRESETS[preset].lcpGate });
              for (let p = 0; p < n; p++) {
                assert(g.W[p * n + p] === 0, `diag ${p}`);
                for (let q = 0; q < n; q++) {
                  const w = g.W[p * n + q];
                  assert(w >= 0, `negative ${p},${q}`);
                  assert(Math.abs(w - g.W[q * n + p]) < 1e-6, `asym ${p},${q}`);
                }
              }
            }
          }
        }
      }
    });

    test('buildGraph: horizontal-only graph equals the analytic ring lattice', () => {
      const m = 5;
      const e = env('abcdefghij', {
        sentinel: false, alpha: 1, beta: 0, radius: [0, 1], kernel: 'box', window: [0, m - 1], columnFocus: null,
      });
      const { n, graph: g } = e;
      for (let p = 0; p < n; p++) {
        for (let q = 0; q < n; q++) {
          const adj = (q - p + n) % n === 1 || (p - q + n) % n === 1;
          const want = adj ? m - 1 : 0;
          assert(Math.abs(g.W[p * n + q] - want) < 1e-6, `W[${p}][${q}] = ${g.W[p * n + q]}, want ${want}`);
        }
      }
    });

    test('Ring preset: diffuse 2-D solution lies on a circle, in ring order', () => {
      const e = env('abcdefghijklmnopqrstuvwx', { sentinel: false, preset: 'ring', dim: 2, optimizer: 'diffuse' });
      const emb = makeEmbedder(e);
      const r = emb.solve({ tol: 1e-9, maxIter: 20000 });
      const X = emb.matrix();
      const n = e.n;
      let mx = 0, my = 0;
      for (let p = 0; p < n; p++) { mx += X[2 * p]; my += X[2 * p + 1]; }
      mx /= n; my /= n;
      const radii = [];
      const ang = [];
      for (let p = 0; p < n; p++) {
        const x = X[2 * p] - mx;
        const y = X[2 * p + 1] - my;
        radii.push(Math.hypot(x, y));
        ang.push(Math.atan2(y, x));
      }
      const mean = radii.reduce((a, b) => a + b, 0) / n;
      const sd = Math.sqrt(radii.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
      assert(sd / mean < 0.02, `radial cv ${(sd / mean).toFixed(4)}`);
      let sign = 0;
      for (let p = 0; p < n; p++) {
        let dA = ang[(p + 1) % n] - ang[p];
        while (dA > Math.PI) dA -= 2 * Math.PI;
        while (dA <= -Math.PI) dA += 2 * Math.PI;
        const s = Math.sign(dA);
        assert(s !== 0, 'zero angular step');
        if (!sign) sign = s;
        assert(s === sign, `angle not monotone at ${p}`);
      }
      return `cv ${(sd / mean).toExponential(1)}, ${r.iter} iterations`;
    });

    test('Contrastive: loss decreases on average over 200 steps; effective rank > 1.5', () => {
      const e = env('abracadabra', { dim: 8, optimizer: 'contrastive' });
      const emb = makeEmbedder(e);
      const losses = [];
      for (let i = 0; i < 200; i++) losses.push(emb.step(1).loss);
      assert(losses.every(Number.isFinite), 'non-finite loss');
      const avg = (a) => a.reduce((s, v) => s + v, 0) / a.length;
      const first = avg(losses.slice(0, 20));
      const last = avg(losses.slice(-20));
      assert(last <= first + 1e-9, `loss rose: ${first} → ${last}`);
      const rank = effectiveRank(emb.matrix(), e.n, 8);
      assert(rank > 1.5, `effective rank ${rank}`);
      return `loss ${first.toFixed(4)} → ${last.toFixed(4)}, rank ${rank.toFixed(2)}`;
    });

    test('Diffuse from two seeds agrees after Procrustes', () => {
      const e = env('abcdefghijklmnop', { sentinel: false, preset: 'ring', dim: 2, optimizer: 'diffuse' });
      const a = makeEmbedder(e, { seed: 1 });
      const b = makeEmbedder(e, { seed: 7 });
      a.solve({ tol: 1e-10, maxIter: 20000 });
      b.solve({ tol: 1e-10, maxIter: 20000 });
      const A = a.matrix();
      const B = b.matrix();
      const n = e.n;
      const R = procrustes(A, B, n, 2);
      let num = 0, den = 0;
      for (let p = 0; p < n; p++) {
        for (let j = 0; j < 2; j++) {
          const v = A[2 * p] * R[j] + A[2 * p + 1] * R[2 + j];
          num += (v - B[2 * p + j]) ** 2;
          den += B[2 * p + j] ** 2;
        }
      }
      const res = Math.sqrt(num / den);
      assert(res < 1e-3, `residual ${res}`);
      return `residual ${res.toExponential(1)}`;
    });

    test('Warm start: surviving ids keep bit-identical vectors after an insertion', () => {
      const e1 = env('hello world');
      const emb = makeEmbedder(e1);
      emb.step(20);
      const before = new Map(e1.ring.map((c) => [c.id, Array.from(emb.get(c.id))]));
      const { chars } = applyEdit(e1.chars, 'hello, world');
      const e2 = envFromChars(chars);
      emb.sync(e2.ring.map((c) => c.id), e2.codes);
      emb.setGraph(e2.graph);
      let kept = 0;
      for (const c of e2.ring) {
        const old = before.get(c.id);
        const now = emb.get(c.id);
        assert(now && now.length === 8, `missing vector for ${c.id}`);
        if (!old) continue;
        for (let i = 0; i < old.length; i++) assert(Object.is(old[i], now[i]), `id ${c.id} changed at ${i}`);
        kept++;
      }
      assert(kept === e1.ring.length, `kept ${kept} of ${e1.ring.length}`);
      return `${kept} ids preserved`;
    });

    test('n = 0, 1, 2 and "aaaa" run without NaNs', () => {
      const cases = [
        ['', { sentinel: false }], ['', { sentinel: true }],
        ['a', { sentinel: false }], ['a', { sentinel: true }], ['ab', { sentinel: false }],
        ['aaaa', { sentinel: false }], ['aaaa', { sentinel: true }],
      ];
      for (const [text, opts] of cases) {
        for (const optimizer of ['contrastive', 'diffuse']) {
          for (const preset of ['context', 'substitution', 'ring']) {
            const e = env(text, { ...opts, preset, optimizer, glyphTying: 0.5 });
            const emb = makeEmbedder(e);
            emb.step(20);
            emb.solve({ maxIter: 200 });
            emb.step(5);
            const X = emb.matrix();
            assert(X.every(Number.isFinite), `NaN in X for "${text}" ${optimizer} ${preset}`);
            assert(e.n === 0 || Number.isFinite(emb.loss), `loss ${emb.loss} for "${text}" ${optimizer} ${preset}`);
            const d = emb.dim;
            const m = [effectiveRank(X, e.n, d), knnPurity(X, e.n, d, e.codes), ringSmoothness(X, e.n, d).ratio, ...boundarySignal(X, e.n, d)];
            assert(m.every(Number.isFinite), `NaN metric for "${text}"`);
          }
        }
      }
    });

    const out = document.getElementById('out');
    out.replaceChildren(...results.map((r) => {
      const line = document.createElement('div');
      line.className = r.ok ? 'pass' : 'fail';
      line.textContent = `${r.ok ? 'PASS' : 'FAIL'}  ${r.name}${r.note ? `  (${r.note})` : ''}`;
      return line;
    }));
    const failed = results.filter((r) => !r.ok).length;
    const summary = document.createElement('div');
    summary.textContent = `\n${results.length - failed}/${results.length} passed`;
    out.append(summary);
  </script>
</body>
</html>
