<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Momentum-Exchange Fields — CR3BP</title>
    <link href="css/style.css" rel="stylesheet"/>
    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        } }
    </script>
</head>
<body>
<main>
    <canvas id="view"></canvas>
    <div class="cap left">rotating frame (x, y)</div>
    <div class="cap right">encounter manifold: α ∈ [0°,360°) →, β ∈ (−90°,90°) ↑</div>
</main>
<div class="panel" data-title="System — momentum-exchange fields" data-width="250" id="p-system">
        <label>Preset <select id="system"></select></label>
        <div class="info" id="muInfo"></div>
        <label>ρ / r<sub>H</sub> <input id="rhoFactor" min="0.1" step="0.1" type="number" value="1"></label>
        <label>k<sub>far</sub> <input id="kFar" min="1.1" step="0.5" type="number" value="2"></label>
</div>
<div class="panel" data-title="Jacobi level C" data-width="250" id="p-jacobi">
        <input id="C" step="0.00001" type="range">
        <input id="Cnum" step="0.0001" type="number">
        <div class="info" id="Cticks"></div>
        <div class="row">
            <button data-preset="l1closed">L1 closed</button>
            <button data-preset="l1open">L1 open</button>
            <button data-preset="l2open">L2 open</button>
            <button data-preset="l3open">L3 open</button>
        </div>
</div>
<div class="panel" data-title="Computation" data-width="250" id="p-compute">
        <label>Grid N <select id="N">
            <option>64</option>
            <option selected>128</option>
            <option>256</option>
            <option>512</option>
        </select></label>
        <label>T <input id="T" step="1" type="number" value="20"></label>
        <label>rtol <select id="rtol">
            <option>1e-10</option>
            <option selected>1e-11</option>
            <option>1e-12</option>
        </select></label>
        <div class="row">
            <button id="run">Compute</button>
            <button id="cancel">Cancel</button>
        </div>
        <div class="info" id="progress">idle</div>
</div>
<div class="panel" data-title="Layers" data-width="250" id="p-layers">
        <label>Scalar <select id="scalar"></select></label>
        <div class="info" id="legend"></div>
        <label><input checked id="showPot" type="checkbox"> L0 potential</label>
        <label><input checked id="showZvc" type="checkbox"> L1 zero-velocity</label>
        <label><input checked id="showRing" type="checkbox"> ΔE ring</label>
        <label>ring <select id="ringReduce">
            <option>mean</option>
            <option>max</option>
            <option>min</option>
        </select></label>
        <label><input id="showQuiver" type="checkbox"> L5 Δv quiver</label>
        <label><input id="showStream" type="checkbox"> L6 dΔE streamlines</label>
        <label><input id="showGlyph" type="checkbox"> L9 operator glyphs</label>
        <div class="row">
            <button id="fitSys">Fit system</button>
            <button id="fitSec">Fit secondary</button>
        </div>
        <div class="row">
            <button id="png">PNG</button>
            <button id="bin">Export grid</button>
        </div>
</div>
<div class="panel resizable" data-help="Click a point on the right (encounter manifold) view." data-title="Inspector"
     data-width="260" id="p-inspector">
        <pre id="inspector">click the right panel</pre>
</div>
<script src="src/main.js" type="module"></script>
</body>
</html>
