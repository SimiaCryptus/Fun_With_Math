<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Momentum-Exchange Fields — CR3BP</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  } }
  </script>
</head>
<body>
  <aside id="panel">
    <h1>Momentum-exchange fields</h1>
    <fieldset><legend>System</legend>
      <label>Preset <select id="system"></select></label>
      <div id="muInfo" class="info"></div>
      <label>ρ / r<sub>H</sub> <input id="rhoFactor" type="number" value="1" step="0.1" min="0.1"></label>
      <label>k<sub>far</sub> <input id="kFar" type="number" value="2" step="0.5" min="1.1"></label>
    </fieldset>
    <fieldset><legend>Jacobi level C</legend>
      <input id="C" type="range" step="0.00001">
      <input id="Cnum" type="number" step="0.0001">
      <div id="Cticks" class="info"></div>
      <div class="row">
        <button data-preset="l1closed">L1 closed</button>
        <button data-preset="l1open">L1 open</button>
        <button data-preset="l2open">L2 open</button>
        <button data-preset="l3open">L3 open</button>
      </div>
    </fieldset>
    <fieldset><legend>Computation</legend>
      <label>Grid N <select id="N"><option>64</option><option selected>128</option><option>256</option><option>512</option></select></label>
      <label>T <input id="T" type="number" value="20" step="1"></label>
      <label>rtol <select id="rtol"><option>1e-10</option><option selected>1e-11</option><option>1e-12</option></select></label>
      <div class="row"><button id="run">Compute</button><button id="cancel">Cancel</button></div>
      <div id="progress" class="info">idle</div>
    </fieldset>
    <fieldset><legend>Layers</legend>
      <label>Scalar <select id="scalar"></select></label>
      <div id="legend" class="info"></div>
      <label><input type="checkbox" id="showPot" checked> L0 potential</label>
      <label><input type="checkbox" id="showZvc" checked> L1 zero-velocity</label>
      <label><input type="checkbox" id="showRing" checked> ΔE ring</label>
      <label>ring <select id="ringReduce"><option>mean</option><option>max</option><option>min</option></select></label>
      <label><input type="checkbox" id="showQuiver"> L5 Δv quiver</label>
      <label><input type="checkbox" id="showStream"> L6 dΔE streamlines</label>
      <label><input type="checkbox" id="showGlyph"> L9 operator glyphs</label>
      <div class="row"><button id="fitSys">Fit system</button><button id="fitSec">Fit secondary</button></div>
      <div class="row"><button id="png">PNG</button><button id="bin">Export grid</button></div>
    </fieldset>
    <fieldset><legend>Inspector</legend><pre id="inspector">click the right panel</pre></fieldset>
  </aside>
  <main><canvas id="view"></canvas>
    <div class="cap left">rotating frame (x, y)</div>
    <div class="cap right">encounter manifold: α ∈ [0°,360°) →, β ∈ (−90°,90°) ↑</div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
