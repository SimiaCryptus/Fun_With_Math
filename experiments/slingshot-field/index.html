<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Momentum-Exchange Fields — CR3BP</title>
    <link href="css/style.css" rel="stylesheet"/>
    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        } }
    </script>
</head>
<body>
<main>
    <canvas id="view"></canvas>
    <div class="cap left">rotating frame (x, y) about the barycentre — hover for readout · drag to pan · wheel to zoom</div>
</main>

<div class="panel" data-title="System" data-width="270" id="p-system"
     data-help="Circular restricted three-body problem: primaries P1 (mass 1−μ) and P2 (mass μ) move on circular orbits; everything is shown in the frame co-rotating with them. Units: separation = 1, angular rate = 1, total mass = 1.">
    <label data-tip="Primary/secondary pair. Fills in μ, the separation and the radii below. Editing any of those switches to 'Custom'.">Preset <select id="system"></select></label>
    <label data-tip="Mass ratio μ = m₂/(m₁+m₂), in (0, 0.5].">μ <input id="mu" min="0" max="0.5" step="any" type="number"></label>
    <label data-tip="Separation of the primaries in km. Only used to normalize the physical radii.">L [km] <input id="Lkm" min="0" step="any" type="number"></label>
    <label data-tip="Physical radius of the primary P1 in km. Trajectories reaching it are labelled 'collision'.">R₁ [km] <input id="R1km" min="0" step="any" type="number"></label>
    <label data-tip="Physical radius of the secondary P2 in km. Trajectories reaching it are labelled 'collision'.">R₂ [km] <input id="R2km" min="0" step="any" type="number"></label>
</div>

<div class="panel" data-title="Initial conditions" data-width="270" id="p-initial"
     data-help="Where the map's initial states come from. Encounter field: entry states on the circle Σ at Jacobi level C. Spaceship: instantaneous burns along your current trajectory (C is then fixed by the ship's state).">
    <label data-tip="Encounter field: the (α, β) map of entry states on Σ. Spaceship: you are a test particle on an orbit; the map shows the outcome of a burn at each point (time along path) and direction.">Mode <select id="mode">
        <option value="encounter">Encounter field</option>
        <option value="ship">Spaceship</option>
    </select></label>
    <div class="row">
        <button id="toShip" data-tip="Switch to spaceship mode using the selected entry state on Σ as the ship's current state.">Fly selected entry as ship</button>
    </div>

    <div class="sep">Encounter circle Σ</div>
    <label data-tip="Centre of the encounter circle Σ on which entry states are seeded and exits are recorded. In spaceship mode the circle defines what counts as an encounter.">Σ centre <select id="center">
        <option value="secondary">P2 (secondary)</option>
        <option value="primary">P1 (primary)</option>
        <option value="barycentre">barycentre</option>
    </select></label>
    <label data-tip="Encounter radius ρ as a multiple of the Hill radius r_H = (μ/3)^(1/3) of P2.">ρ / r<sub>H</sub> <input id="rhoFactor" min="0.1" step="0.1" type="number" value="1"></label>
    <label data-tip="Outer radius ρ_far = k_far·ρ. An encounter counts as finished when the trajectory reaches ρ_far; dipping back inside ρ before that counts as an additional pass.">k<sub>far</sub> <input id="kFar" min="1.1" step="0.5" type="number" value="2"></label>
    <div class="info" id="muInfo"
         data-tip="r_H: Hill radius of P2. ρ: radius of the encounter circle Σ. R₁, R₂: physical radii in units of the primaries' separation."></div>

    <div class="sep">Jacobi level C</div>
    <input id="C" step="0.00001" type="range"
           data-tip="Drag to preview the zero-velocity curve live in the physical view; releasing the slider recomputes the field. (Fixed by the ship's state in spaceship mode.)">
    <input id="Cnum" step="0.0001" type="number"
           data-tip="Exact Jacobi constant. Edit and press Enter (or leave the field) to recompute.">
    <label>Presets <select id="Cpreset">
        <option value="">Jacobi presets…</option>
        <option value="l1closed">L1 closed</option>
        <option value="l1open">L1 open</option>
        <option value="l2open">L2 open</option>
        <option value="l3open">L3 open</option>
    </select></label>
    <div class="info" id="Cticks"
         data-tip="Critical Jacobi values at the Lagrange points. When C drops below C_Li, the zero-velocity curve opens at Li and trajectories can pass through that neck."></div>
</div>

<div class="panel" data-title="Spaceship" data-width="270" id="p-ship"
     data-help="You are a test particle. Your current trajectory (cyan) is the context of the map: x = time along the path, y = impulse direction θ from your velocity (0° prograde, ±180° retrograde, +90° to the left). Every pixel is an instantaneous, unbudgeted burn of |Δv| followed by a coast of horizon T. Click a pixel to preview that orbit, Navigate to fly it (it becomes the new basis), Back to undo.">
    <label data-tip="Orbit the ship starts on (circular two-body orbit expressed in the rotating frame).">Start orbit <select id="shipPreset"></select></label>
    <label data-tip="Impulse magnitude in normalized velocity units (separation × angular rate). Instant and unbudgeted; changing it replots the map.">|Δv| <input id="shipDv" min="0" step="0.01" type="number" value="0.05"></label>
    <label data-tip="Length (in time) of the current path shown along the horizontal axis of the map. 2π = one revolution of the primaries.">Path span <input id="shipSpan" min="0.1" step="0.5" type="number" value="6.2832"></label>
    <div class="row">
        <button id="shipGo" data-tip="Fly the selected burn: the post-burn orbit becomes the new path and the map is replotted.">Navigate</button>
        <button id="shipBack" data-tip="Undo the last navigation.">Back</button>
        <button id="shipReset" data-tip="Return to the start orbit.">Reset</button>
        <button id="fitShip" data-tip="Zoom the physical view to the current path.">Fit path</button>
    </div>
    <div class="info" id="shipInfo"></div>
</div>

<div class="panel" data-title="Computation" data-width="250" id="p-compute"
     data-help="Every grid sample integrates one trajectory together with its 4×4 state-transition matrix (for the analytic derivatives) in parallel web workers.">
    <label data-tip="Starting grid resolution N×N over the map. Use 'Refine' in the manifold window to increase it ×3 per step (up to 4096²), reusing the samples already computed.">Start N <select id="N">
        <option>32</option>
        <option>48</option>
        <option>64</option>
        <option>96</option>
        <option selected>128</option>
        <option>192</option>
        <option>256</option>
        <option>512</option>
    </select></label>
    <label data-tip="Encounter mode: maximum integration time (trajectories not exited by T are 'captured'). Spaceship mode: the coast horizon after each burn. 2π = one revolution of the primaries.">T <input id="T" step="1" type="number" value="20"></label>
    <label data-tip="Relative (and absolute) error tolerance of the adaptive Dormand–Prince 5(4) integrator. Smaller = more accurate but slower.">rtol <select id="rtol">
        <option>1e-10</option>
        <option selected>1e-11</option>
        <option>1e-12</option>
    </select></label>
    <div class="row">
        <button id="run" data-tip="Integrate the whole grid at the start resolution. Results are cached per parameter set.">Compute</button>
        <button id="cancel" data-tip="Abort the running computation or refinement.">Cancel</button>
    </div>
    <div class="info" id="progress" data-tip="Progress of the current computation, then total time and the number of samples per outcome label.">idle</div>
</div>

<div class="panel" data-title="Physical view" data-width="250" id="p-physical"
     data-help="Display options for the full-window rotating-frame view behind the panels. Hover the view for coordinates, potential and accessibility.">
    <label data-tip="L0: contour lines of the effective potential Ω(x, y) = ½(x²+y²) + (1−μ)/r₁ + μ/r₂ (logarithmically spaced)."><input checked id="showPot" type="checkbox"> L0 potential</label>
    <label data-tip="L1: zero-velocity curve 2Ω = C (gold line) and the forbidden region 2Ω < C (shaded) that no trajectory can enter at the current Jacobi level."><input checked id="showZvc" type="checkbox"> L1 zero-velocity</label>
    <label data-tip="Colour ring just outside ρ: ΔE reduced over all entry angles β for each entry position α (blue = energy loss, red = energy gain). Encounter mode only."><input checked id="showRing" type="checkbox"> ΔE ring</label>
    <label data-tip="How ΔE is reduced over β for each α of the ring: mean over all exits, maximum gain, or maximum loss.">ring <select id="ringReduce">
        <option>mean</option>
        <option>max</option>
        <option>min</option>
    </select></label>
    <div class="row">
        <button id="fitSys" data-tip="Zoom out to both primaries and all five Lagrange points.">Fit system</button>
        <button id="fitSec" data-tip="Zoom to the encounter circles ρ and ρ_far.">Fit Σ</button>
        <button id="png" data-tip="Save the physical view as a PNG image.">PNG</button>
    </div>
</div>

<div class="panel resizable" data-help="Click a point in the manifold window to integrate that trajectory; all per-sample fields appear here. Arrow keys then step the selection through the grid (shift = larger steps). Hover a line for its meaning."
     data-title="Inspector" data-width="260" id="p-inspector">
    <pre id="inspector">click the manifold</pre>
</div>

<div class="panel plot" data-dock="right" data-height="540" data-width="580" data-title="Encounter manifold (α, β)" id="p-manifold"
     data-help="Encounter mode: each pixel is one entry state on Σ_in at the chosen C; α (horizontal) is the entry position angle about the circle centre, β (vertical) the angle of the incoming velocity from the inward normal (β > 0 = prograde). Spaceship mode: horizontal = time along the current path, vertical = impulse direction θ. Hover for values, click to integrate, arrow keys to step, drag to pan, wheel to zoom. 'Refine view' computes a sharper grid locked to the visible window.">
    <div class="toolbar">
        <label>Layer <select id="scalar"></select></label>
        <label data-tip="L5: arrows of the inertial velocity change Δv_I = v_out − v_in, drawn in the map plane. Length ∝ √|Δv|, colour by |Δv|."><input id="showQuiver" type="checkbox"> Δv quiver</label>
        <label data-tip="L6: streamlines along the gradient of ΔE over the map coordinates: the directions in which changing the initial conditions increases the energy gain fastest."><input id="showStream" type="checkbox"> ∇ΔE streams</label>
        <label data-tip="L9: image of the unit circle under the linearized velocity map A = ∂v_out/∂v_in (blue ellipses; red = orientation-reversing). The yellow tick shows the effective deflection angle δ_eff."><input id="showGlyph" type="checkbox"> A glyphs</label>
        <button id="fitMan" data-tip="Reset pan and zoom to the full manifold.">Fit</button>
        <button id="pngMan" data-tip="Save the manifold view as a PNG image.">PNG</button>
        <button id="bin" data-tip="Download the raw grid: one JSON header line (metadata, field names, dtype), then the outcome labels (Uint8, N²) and the field array (Float32, N² × fields, sample-major).">Export grid</button>
    </div>
    <div class="toolbar">
        <button id="refine" data-tip="Increase the resolution of the whole map ×3 (capped at 4096²). Samples that coincide with the current grid are reused; the image refines progressively while the rest is computed.">Refine</button>
        <label data-tip="Resolution of the viewport-locked refinement grid.">view <select id="viewN">
            <option>128</option>
            <option selected>256</option>
            <option>512</option>
        </select></label>
        <button id="refineView" data-tip="Zoom in first, then compute a new grid locked to exactly the visible window. It stays pinned there (amber outline) when you pan or zoom.">Refine view</button>
        <button id="dismissView" data-tip="Remove the viewport-locked grid and zoom back out to the full map.">Dismiss view</button>
        <progress id="pbar" max="1" value="0"></progress>
        <span class="info" id="pstat"></span>
    </div>
    <div id="legend"></div>
    <div class="viewport"><canvas id="mview"></canvas></div>
</div>

<script src="src/main.js" type="module"></script>
</body>
</html>
