e1 surface2 = stepL\ndL surface2 surface3 = stepL\nlock H slate surface1 surface2 surface3 surfaceActive surfaceHover border borderStrong\ndC canvas surface1   = 0.0079            # measured 0.00788\ndC surface1 surface2 = stepC\ndC surface2 surface3 = stepC\n\n# ---- states of surface3 (header drag, button hover) -----------------------\ndL surface3 surfaceActive = activeStep\ndC surface3 surfaceActive = 0.0074       # measured 0.00739 (lock C rejected: hover/active are more saturated)\ndL surface3 surfaceHover  = hoverStep\ndC surface3 surfaceHover  = 0.014        # measured 0.01401\n\n# ---- borders --------------------------------------------------------------\ndL surface3 border = borderStep\nlock C surface3 border                   # 0.0243 vs 0.0236\ndC border borderStrong = 0.006           # measured 0.00605\ncontrast borderStrong surface1 >= 3      # button outline vs panel: 1.79:1 — FAILS (solver lightens)\ndistance surface1 borderStrong -> min weight 0.05\nC borderField <= 0.002                   # pure gray; an inequality avoids the undefined gradient at C = 0\ncontrast borderField surface1 >= 3       # input outline vs panel: 1.47:1 — FAILS (solver lightens)\ndistance surface1 borderField -> min weight 0.05\ndL surface1 borderSubtle = subtleStep\nC borderSubtle <= 0.002                  # pure gray #222\ncontrast border surface1 >= 3 disabled         # decorative divider, 1.33:1 — see findings\ncontrast borderSubtle surface1 >= 3 disabled   # decorative toolbar rule, 1.17:1 — see findings\n\n# ---- text -----------------------------------------------------------------\nL text = textL\nC text <= 0.002                          # pure gray #ddd\ncontrast text canvas >= 7                # AAA body text: 14.74:1\ncontrast text surfaceHover >= 7          # worst background for body text (button:hover): 9.71:1\ndL text textMuted = mutedStep\ndL text heading   = headingStep\nlock H tealGray textMuted heading\nlock C tealGray textMuted heading\ncontrast textMute = -0.4\n  var helpBorderStep = -0.3\n  var tipBorderStep = -0.4\n  surface1     at oklch(97% 0.012 265.5)   # seeds only from here on: start the outputs on the light side\n  text         at oklch(25% 0 0)\n  textMuted    at oklch(45% 0.0185 196.8)\n  textFaint    at oklch(50% 0.026 285.5)   # floor-driven: must approach the floor from the dark side\n  borderStrong at oklch(60% 0.03 265.5)\n  borderField  at oklch(60% 0 0)\n}\ntheme midnight {                         # proposed: blue-black canvas, more saturated chrome, dark nesting kept\n  canvas at oklch(12% 0.025 262)\n  slate       at oklch(30% 0.045 262)      # orientation override: chrome hue and family shift to deep blue\n  readingGray at oklch(62% 0.035 270)\n  var liftL = 0.05\n  var stepL = 0.028\n  var stepC = 0.006\n}\ntheme dim {                              # proposed: softer dark for long sessions; lighter canvas, tighter steps\n  canvas at oklch(22% 0.01 265)\n  var liftL = 0.035\n  var stepL = 0.022\n  var activeStep = 0.04\n  var hoverStep = 0.06\n  var borderStep = 0.045\n  var subtleStep = 0.05\n  var tipBorderStep = 0.2\n  textFaint at oklch(62% 0.026 285.5)      # seed: floor-driven, start above the 4.5:1 line\n}\ntheme sepia {                            # proposed: warm paper light theme; light nesting, warm gray families\n  canvas at oklch(93% 0.025 85)\n  slate       at oklch(60% 0.03 75)        # orientation overrides: every gray family turns warm\n  tealGray    at oklch(50% 0.035 55)\n  readingGray at oklch(50% 0.03 60)\n  var liftL = 0.02\n  var stepL = -0.03\n  var activeStep = -0.04\n  var hoverStep = -0.06\n  var borderStep = -0.13\n  var subtleStep = -0.09\n  var textL = 0.27\n  var mutedStep = 0.19\n  var headingStep = 0.09\n  var iconStep = 0.19\n  var iconHoverStep = -0.38\n  var helpBorderStep = -0.3\n  var tipBorderStep = -0.4\n  surface1     at oklch(95% 0.03 80)       # seeds: start the outputs on the light side\n  text         at oklch(27% 0 0)\n  textMuted    at oklch(46% 0.035 55)\n  textFaint    at oklch(50% 0.03 60)\n  borderStrong at oklch(60% 0.03 75)\n  borderField  at oklch(60% 0 0)\n}\ntheme highcontrast {                     # proposed: high-contrast dark; AAA text floor, visible dividers and rings ('contrast' is a reserved word)\n  canvas at oklch(6% 0.004 265)\n  var textFloor = 7\n  var textL = 0.97\n  var mutedStep = -0.1\n  var headingStep = -0.04\n  var iconStep = -0.08\n  var iconHoverStep = 0.109\n  var borderStep = 0.3\n  var subtleStep = 0.25\n  var helpBorderStep = 0.4\n  var tipBorderStep = 0.5\n  textFaint at oklch(72% 0.026 285.5)      # seed: floor-driven at 7:1, start above it\n}\n\nsolver gauss-newton iterations 200 tolerance 1e-6\nview camera (300, 250, 400) target (0, 0, 200) up (0, 0, 1) perspective\nview grid none show labels axes hide seeds\n",

            "summary": "**slingshot-field** (Momentum-Exchange Fields — CR3BP explorer) is a dark-only tool UI: floating slate panels over a near-black full-window canvas.\n\n- **Files scanned:** 1 stylesheet — `experiments/slingshot-field/css/style.css`. `experiments/slingshot-field/index.html` was read for context (which elements sit on which background) and is not edited.\n- **Colour literals:** 31 occurrences of 25 distinct literals — 22 opaque colours and 3 `rgba(0, 0, 0, a)` overlays. `transparent` ×2, `currentColor` ×0. No custom properties, no gradients, no theme switching.\n- **Clusters (ΔE_ok ≤ 0.02):** 20 opaque clusters plus 1 black overlay cluster. Two merges: `#2a2f3a → #262c38` (ΔE 0.013) and `#1d2330 → #1a1f2b` (ΔE 0.016).\n- **Themes:** 1 found (`dark`, unconditional — the stylesheet has no `prefers-color-scheme`, attribute or class mechanism), 1 proposed (`light`, switched with `[data-theme='light']`).\n- **Tokens:** 20 exported — 1 anchor (`canvas`) and 19 derived — plus 3 orientation points (`slate`, `tealGray`, `readingGray`) that carry the hues of the three gray families.\n- **Accessibility:** 6 contrast findings. 2 active floors the CSS fails (button and field outlines against the panel, 1.79:1 and 1.47:1 < 3:1); 4 decorative-border floors written but `disabled` (1.17–2.26:1). Every text pair passes; the canvas caption passes with only 1 % margin (4.56:1 vs 4.5:1).\n- **Not tokenised:** the black shadow / chip-border overlays and everything drawn on `<canvas>` by `src/*.js`.",
            "replacements": "Replace each literal in `experiments/slingshot-field/css/style.css` as follows (line numbers refer to the current file). The fallback after the comma is optional; keep it only if the tokens file might load late.\n\n| line | selector | property | current | replace with |\n|---|---|---|---|---|\n| 5 | `html, body` | `background` | `#07080b` | `var(--color-canvas)` |\n| 6 | `html, body` | `color` | `#ddd` | `var(--color-text)` |\n| 23 | `.cap` | `color` | `#778` | `var(--color-text-faint)` |\n| 46 | `.panel` | `background` | `rgba(16, 19, 26, 0.95)` | `color-mix(in oklab, var(--color-surface-1) 95%, transparent)` (see Alpha) |\n| 47 | `.panel` | `border` colour | `#2a2f3a` | `var(--color-border)` |\n| 49 | `.panel` | `box-shadow` | `rgba(0, 0, 0, 0.55)` | keep (see Skip) |\n| 57 | `.panel > header` | `background` | `#1a1f2b` | `var(--color-surface-3)` |\n| 58 | `.panel > header` | `border-bottom` colour | `#262c38` | `var(--color-border)` |\n| 67 | `.panel > header.dragging` | `background` | `#222a3a` | `var(--color-surface-active)` |\n| 135 | `.help` | `border` colour | `#556` | `var(--color-help-border)` |\n| 136 | `.help` | `color` | `#9ab` | `var(--color-help)` |\n| 147 | `.tog` | `color` | `#aab` | `var(--color-icon)` |\n| 152 | `.tog:hover` | `color` | `#fff` | `var(--color-icon-hover)` |\n| 163 | `input[type=number], select` | `background` | `#151922` | `var(--color-surface-2)` |\n| 164 | `input[type=number], select` | `color` | `#ddd` | `var(--color-text)` |\n| 165 | `input[type=number], select` | `border` colour | `#333` | `var(--color-border-field)` |\n| 173 | `button` | `background` | `#1d2330` | `var(--color-surface-3)` (merged, see Findings) |\n| 174 | `button` | `color` | `#ddd` | `var(--color-text)` |\n| 175 | `button` | `border` colour | `#384050` | `var(--color-border-strong)` |\n| 181 | `button:hover` | `background` | `#273044` | `var(--color-surface-hover)` |\n| 192 | `.info` | `color` | `#9aa` | `var(--color-text-muted)` |\n| 199 | `.sep` | `border-top` colour | `#262c38` | `var(--color-border)` |\n| 201 | `.sep` | `color` | `#bcc` | `var(--color-heading)` |\n| 231 | `.toolbar` | `border-bottom` colour | `#222` | `var(--color-border-subtle)` |\n| 255 | `#legend` | `color` | `#9aa` | `var(--color-text-muted)` |\n| 256 | `#legend` | `border-bottom` colour | `#222` | `var(--color-border-subtle)` |\n| 263 | `#cbar` | `border` colour | `#333` | `var(--color-border-field)` |\n| 272 | `.chip` | `border` colour | `rgba(0, 0, 0, 0.4)` | keep (see Skip) |\n| 300 | `#tip` | `background` | `rgba(0, 0, 0, 0.88)` | `color-mix(in oklab, var(--color-canvas) 88%, transparent)` (see Alpha) |\n| 301 | `#tip` | `border` colour | `#445` | `var(--color-tip-border)` |\n| 303 | `#tip` | `color` | `#dde` | `var(--color-tip-text)` |\n\nIn shorthand declarations replace only the colour part, e.g. line 47 becomes `border: 1px solid var(--color-border);`.",
            "plumbing": "1. Save the solved CSS (_Save CSS_) as `experiments/slingshot-field/css/slingshot-field-tokens.css`.\n2. In `experiments/slingshot-field/index.html`, add the tokens **before** the existing stylesheet:\n\n   ```html\n   <link href=\"css/slingshot-field-tokens.css\" rel=\"stylesheet\"/>\n   <link href=\"css/style.css\" rel=\"stylesheet\"/>\n   ```\n\n3. The emitter writes the first theme (`dark`) to `:root`, so the page stays dark with no further change. `switchMode` is `attribute`: no `prefers-color-scheme` block is relied upon, because the current UI ignores the OS preference and should keep doing so.\n4. To try the proposed light theme set `document.documentElement.dataset.theme = 'light'` (and remove the attribute, or set `'dark'`, to return).\n5. Add `color-scheme: dark;` to the `html, body` rule and `[data-theme='light'] { color-scheme: light; }` to `style.css` so native widgets (`<progress>`, range slider, checkboxes, scrollbars) follow the theme.\n6. Optional: the canvas renderer in `src/*.js` can read tokens with `getComputedStyle(document.documentElement).getPropertyValue('--color-text-faint')` for axis labels, so drawn text follows the theme too.",

            "skip": "- `transparent` at lines 144 and 151 (`.tog`, `.tog:hover` background) — not a colour to solve; keep.\n- The two black overlays at lines 49 and 272 — see Alpha.\n- Everything drawn on `<canvas id=view>` and `<canvas id=mview>` (trajectories, zero-velocity curve, ΔE ring, colour maps, quiver, glyphs, amber refine outline) — painted by `src/*.js`, not present in CSS. Out of scope for this pass.\n- Inline legend swatch colours created by script (`.chip` backgrounds) — data colours, not UI theme.\n- User-agent-styled controls (`<progress id=pbar>`, `input[type=range]`, checkboxes) — not styled in `style.css`; handled by `color-scheme` (see Plumbing).",
            "order": "1. Generate and save `slingshot-field-tokens.css` (dark is `:root`).\n2. Link it before `style.css` (Plumbing step 2) and reload — nothing changes visually yet.\n3. Apply the Replacements table top to bottom. After each block (canvas/text, panel chrome, controls, toolbar/legend, tooltip) reload and compare against the old screenshot; only the merged button background (slightly darker) and the two lightened outlines (buttons, inputs) should differ.\n4. Apply the two `color-mix()` rewrites from Alpha.\n5. Add `color-scheme` (Plumbing step 5).\n6. Search `style.css` for `#` and `rgb` once more: only lines 49 and 272 should remain.\n7. Optional: set `data-theme='light'` and review the proposed theme; tune its anchor and variables in the harness, re-solve, re-export.",
            "findings": "### Accessibility\n\n| pair | where | measured | floor | rule state |\n|---|---|---|---|---|\n| `borderStrong` on `surface1` | button outline on panel | 1.79:1 | 3 | **active — CSS fails**; solver lightens `#384050` to ≈ oklch(49.3% 0.030 265.5) |\n| `borderField` on `surface1` | input / select / #cbar outline on panel | 1.47:1 | 3 | **active — CSS fails**; solver lightens `#333` to ≈ oklch(49.25% 0 0) ≈ #616161 |\n| `border` on `surface1` | header rule, .sep rule (panel outline #2a2f3a on canvas: 1.49:1) | 1.33:1 | 3 | written, `disabled` — decorative divider, WCAG 1.4.11 does not require it; enabling it moves dividers to L ≈ 49 % |\n| `borderSubtle` on `surface1` | toolbar / legend rule | 1.17:1 | 3 | written, `disabled` — decorative |\n| `helpBorder` on `surface3` | ring around the `?` glyph | 2.26:1 | 3 | written, `disabled` — the glyph (6.92:1) identifies the control |\n| `tipBorder` on `canvas` | tooltip outline | 2.10:1 | 3 | written, `disabled` — non-interactive overlay |\n| `textFaint` on `canvas` | .cap caption | 4.56:1 | 4.5 | holds by 1 %; `distance -> min` moves it to exactly 4.5:1 (L 57.5 % → ≈ 57.2 %) |\n\nAll other text pairs pass with margin: text 14.74 (canvas) / 9.71 (button:hover), textMuted 7.68, heading 11.18, icon 7.20, iconHover 16.47, help 6.92, tipText 14.93.\n\n### Merges and ambiguous roles\n\n- **`#1d2330` (button) → `surface3` (`#1a1f2b`, header)**, ΔE 0.016. Buttons darken from L 25.6 % to 24.0 %; their label contrast improves (11.6 → 12.1:1). Split into a `control` token if the difference was intentional.\n- **`#2a2f3a` (panel outline) → `border` (`#262c38`)**, ΔE 0.013. The panel outline darkens by 1.2 % L.\n- **`#9ab` → `help`**: the only distinctly blue text colour, used once. Treated as its own token tied to the chrome hue (`dH slate help = -16.5`); it is not a brand colour.\n- **No brand colour.** The stylesheet contains no saturated colour; the app's accent colours live on the canvas. The sketch therefore has a single anchor (`canvas`). If a brand hue is introduced later, add `point brand … anchor` and relate `help` to it instead of `slate`.\n\n### Hues taken from orientation points\n\n- `canvas`, `surface1`, `surface2` have C < 0.02 — their own hue is numerically unreliable, so the surface family takes its hue from `slate` (265.5°).\n- `textMuted` and `heading` (C 0.018–0.019) take their hue from `tealGray` (196.8°).\n- The shorthand grays `#445 #556 #778 #aab #dde` share H ≈ 285.5° and C ≈ 0.026 (`readingGray`). This is probably an artefact of writing grays as shorthand hex with the blue nibble +1, not a deliberate choice; it is preserved for fidelity. A designer may unify the families by locking `textMuted`/`heading` to `readingGray` too (89° apart today).\n- Pure grays (`#ddd #333 #222 #fff`) use `C <= 0.002` instead of `C = 0`, which has an undefined gradient.\n\n### Proposed theme\n\n- **`light` is proposed**, not found. Its block contains only the anchor (`canvas`), the variable overrides that flip nesting direction, and seeds for floor-driven outputs. Expect ≈ canvas 95 %, surfaces 97 / 94 / 91 %, text 25 %, muted text 45 %, outlines ≈ 65 %.\n- The tooltip background must follow the theme (`color-mix` with `canvas`, see Alpha), otherwise light-theme tooltip text would sit on near-black.\n\n### Rules deliberately not written\n\n- `lock C surface3 surfaceHover` / `surfaceActive` — chroma differs by 0.014 / 0.007 (> 0.005); `dC` offsets used instead.\n- Even ramp from `canvas` — canvas → surface1 is +0.052, about two surface steps; kept as its own `liftL`.\n- `lock L icon help` (Δ 0.013 > 0.01) and `lock C border borderStrong` (Δ 0.006 > 0.005).\n- `iconHover` is written as a step from `icon` landing at L 99.9 % instead of pure white, to keep a gamut margin.\n\n### Other\n\n- No out-of-gamut literals; all are sRGB.\n- The solve should report `0 unmet` for both themes; the four `disabled` floors are not counted.",

            "relations": "Measured on the observed dark values (the only theme found). Status: **holds** (within §2.6 tolerance), **fails** (floor the CSS violates), **disabled** (floor written but switched off), **decision** (design choice).\n\n| rule | tokens | evidence | status |\n|---|---|---|---|\n| `dL canvas surface1 = liftL` | canvas, surface1 | 13.457 → 18.691 %: +0.0523 | holds |\n| `dL … = stepL` ×2 | surface1–3 | +0.0267, +0.0264 (spread 0.0003) | holds |\n| `lock H slate …` | 5 surfaces, border, borderStrong | 266.78, 266.06, 266.98, 263.88, 265.52, 264.12, 264.11 vs 265.5 (max 1.6°) | holds |\n| `dC canvas surface1 = 0.0079` | canvas, surface1 | 0.00722 → 0.01510 | holds |\n| `dC … = stepC` ×2 | surface1–3 | +0.0038, +0.0054 vs 0.0046 | holds (±0.0008) |\n| `dL/dC surface3 surfaceActive` | | +0.0449 / +0.0074 | holds |\n| `dL/dC surface3 surfaceHover` | | +0.0702 / +0.0140 | holds |\n| `dL surface3 border = borderStep` | | +0.0526 | holds |\n| `lock C surface3 border` | | 0.0243 vs 0.0236 | holds |\n| `dC border borderStrong = 0.006` | | 0.0236 → 0.0296 | holds |\n| `contrast borderStrong surface1 >= 3` + `distance -> min` | | 1.79:1 | **fails** |\n| `C borderField <= 0.002`, `contrast … >= 3` + `distance -> min` | | C 0; 1.47:1 | **fails** |\n| `dL surface1 borderSubtle = subtleStep`, `C <= 0.002` | | +0.0651; C 0 | holds |\n| `contrast border surface1 >= 3` | | 1.33:1 | disabled |\n| `contrast borderSubtle surface1 >= 3` | | 1.17:1 | disabled |\n| `L text = textL`, `C text <= 0.002` | text | 0.8975, C 0 | holds (pin) |\n| `contrast text canvas >= 7` | | 14.74:1 | holds |\n| `contrast text surfaceHover >= 7` | | 9.71:1 (worst body-text background) | holds |\n| `dL text textMuted = mutedStep` | | −0.1728 | holds |\n| `dL text heading = headingStep` | | −0.0649 | holds |\n| `lock H/C tealGray textMuted heading` | | H 196.74 / 196.81; C 0.0191 / 0.0180 | holds |\n| `contrast textMuted surface1 >= 4.5` | | 7.68:1 | holds |\n| `contrast heading surface1 >=
