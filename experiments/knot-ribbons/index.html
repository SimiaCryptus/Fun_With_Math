<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ribbon Engine Sandbox</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Ribbon Engine</h1>
    <label>Preset <select id="preset"></select></label>
    <label>Strands n <input id="n" type="number" min="1" max="12" step="1"></label>
    <label>Braid word β<sub>int</sub>
      <textarea id="word" rows="3" spellcheck="false" placeholder="(s1 s2^-1)^2"></textarea>
    </label>
    <label>Framing m (half-twists) <input id="m" type="number" step="1"></label>
    <div id="orient" class="muted"></div>
    <div id="error" class="error"></div>
    <button id="slice" class="primary">Slice ✂</button>
    <label>Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label class="row"><input id="xray" type="checkbox"> X-ray</label>
    <label class="row"><input id="advanced" type="checkbox"> Advanced mode</label>
    <div class="row">
      <button id="undo" title="Ctrl+Z">↶ Undo</button>
      <button id="redo" title="Ctrl+Shift+Z">↷ Redo</button>
      <button id="share">🔗 Share</button>
    </div>
    <div class="adv">
      <label>Cascade cuts (depth ≤ 3)
        <textarea id="cuts" rows="2" spellcheck="false" placeholder="2: s1"></textarea>
      </label>
      <h4>Export</h4>
      <div class="row wrap">
        <button data-export="sage">Sage</button>
        <button data-export="snappy">SnapPy</button>
        <button data-export="pd">PD</button>
        <button data-export="obj">OBJ</button>
        <button data-export="stl">STL</button>
      </div>
    </div>
  </aside>
  <main id="viewport"></main>
  <aside id="readout"></aside>
  <footer id="diagram"></footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
