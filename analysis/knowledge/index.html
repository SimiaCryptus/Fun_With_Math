<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Graph Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header id="topbar">
      <h1>Knowledge&nbsp;Graph&nbsp;Viewer</h1>

      <div class="loaders">
        <label class="btn">
          Open file…
          <input id="file-input" type="file" accept=".json,application/json" hidden />
        </label>
        <input id="url-input" type="text" placeholder="…/x.knowledge_graph.json" spellcheck="false" />
        <button id="url-load" class="btn">Fetch</button>
        <!-- Samples: add/remove a button here; app.js wires them by data-src. -->
        <span class="samples" id="samples">
          <button class="btn" data-src="idea.knowledge_graph.json">This</button>
          <button class="btn" data-src="../theory/idea.knowledge_graph.json">Theory/idea</button>
          <button class="btn" data-src="../../numbers/primegen/docs/generator.knowledge_graph.json">
            Primes/generator
          </button>
        </span>
      </div>

      <div class="spacer"></div>

      <div class="doc-meta" id="doc-meta"></div>

      <div class="tools">
        <button id="btn-queue" class="btn" title="Jump to the definition queue (q)">Queue</button>
        <button id="btn-fit" class="btn" title="Fit to view (f)">Fit</button>
        <button id="btn-relayout" class="btn" title="Recompute layout">Re-layout</button>
        <button id="btn-export" class="btn" title="Download the visible subgraph">Export</button>
      </div>
    </header>

    <main id="layout">
      <aside id="sidebar">
        <div class="panel">
          <label class="field">
            <span>Search</span>
            <input id="q" type="search" placeholder="label, alias, symbol, quote…" spellcheck="false" />
          </label>
          <label class="field">
            <span>Lanes</span>
            <select id="lane-mode">
              <option value="status" selected>definition status</option>
              <option value="group">group (language / content / context)</option>
              <option value="kind">entry kind</option>
              <option value="layer">metaontology layer</option>
            </select>
          </label>
          <label class="field">
            <span>Min mentions <b id="mentions-val">0</b></span>
            <input id="mentions" type="range" min="0" max="20" step="1" value="0" />
          </label>
        </div>

        <details class="panel" open>
          <summary>Definition status</summary>
          <div id="f-status" class="chips"></div>
        </details>

        <details class="panel" open>
          <summary>Group</summary>
          <div id="f-groups" class="chips"></div>
        </details>

        <details class="panel">
          <summary>Entry kinds</summary>
          <div id="f-kinds" class="chips small"></div>
        </details>

        <details class="panel">
          <summary>Role</summary>
          <div id="f-roles" class="chips small"></div>
        </details>

        <details class="panel">
          <summary>Layers</summary>
          <div id="f-layers" class="chips small"></div>
        </details>

        <details class="panel" open>
          <summary>Relation groups</summary>
          <div id="f-relations" class="chips small"></div>
        </details>

        <details class="panel" open>
          <summary>Overlays</summary>
          <div class="checks">
            <label><input type="checkbox" id="o-labels" checked /> labels</label>
            <label><input type="checkbox" id="o-orphans" /> hide isolated</label>
            <label><input type="checkbox" id="o-needs" /> only what needs defining</label>
          </div>
          <label class="field">
            <span>Focus depth <b id="depth-val">off</b></span>
            <input id="depth" type="range" min="0" max="4" step="1" value="0" />
          </label>
        </details>

        <div class="panel legend" id="legend"></div>
        <div class="panel counts" id="counts"></div>
      </aside>

      <section id="stage">
        <div id="graph-host"></div>
        <div id="empty">
          <p><strong>Drop a <code>knowledge_graph.json</code> anywhere</strong></p>
          <p>
            …or open one with the button above, or append
            <code>?src=idea.knowledge_graph.json</code> to the URL.
          </p>
        </div>
      </section>

      <aside id="inspector">
        <div class="placeholder">Select an entry, relation, request or topic.</div>
      </aside>
    </main>

    <section id="bottom">
      <nav id="tabs">
        <button class="tab active" data-tab="entries">Entries</button>
        <button class="tab" data-tab="edges">Relations</button>
        <button class="tab" data-tab="requests">Requests</button>
        <button class="tab" data-tab="topics">Topics</button>
        <button class="tab" data-tab="issues">Issues</button>
        <button class="tab" data-tab="diagnostics">Diagnostics</button>
        <button class="tab" data-tab="stats">Stats</button>
        <span class="grow"></span>
        <button id="bottom-toggle" class="btn ghost" title="Collapse / expand">▾</button>
      </nav>
      <div id="tab-body"></div>
    </section>

    <div id="drop-veil"><span>Drop to load</span></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
