  "pcad": "# theme_design \u2014 Mathematical Explorations (Fun With Math)\n# One colour model, two themes: `dark` found in the CSS, `light` proposed.\nspace oklab\nunits none deg\ngamut srgb\n\n# ---- variables ----------------------------------------------------------\nvar stepL     = 0.041            # canvas\u2192surface1 +0.023, surface1\u2192surface2 +0.059 (mean 0.041)\nvar mutedC    = 4.5   locked     # secondary text: AA floor (measured 6.0:1 on canvas)\nvar accent2C  = 0.165 shared     # violet saturation identical in every theme\nvar hoverStep = 0.069            # brand\u2192brandHover measured +0.069 L\n\n# ---- inputs -------------------------------------------------------------\npoint canvas     at #0a0d14                anchor      label \"body base\"      # oklch(15.5% 0.013 266)\npoint brand      at #58a6ff                anchor      label \"--accent\"       # oklch(70.4% 0.137 250.7)\npoint coolGray   at oklch(60% 0.015 255)   orientation label \"reading gray\"   # hue/chroma shared by text, muted, border\npoint violetAxis at oklch(72% 0.165 303)   orientation label \"violet axis\"    # --accent2 family\n\n# ---- outputs (seeds = observed dark-theme values) -----------------------\npoint surface1     at #0d1117  derived   # --bg / nav / browse-bar\npoint surface2     at #161b22  derived   # --surface / cards / modal\npoint border       at #30363d  derived   # --border\npoint text         at #e6edf3  derived   # --text\npoint textMuted    at #8b949e  derived   # --text-muted\npoint link         at #58a6ff  derived   # nav + body links\npoint brandHover   at #79b8ff  derived   # gradient partner / launch buttons\npoint accent2      at #bc8cff  derived   # --accent2\npoint accent2Hover at #a78bff  derived   # cat-tab gradient / nav-section-link\npoint success      at #7ee787  derived   # --accent3\npoint warning      at #ffa657  derived   # --accent4\npoint highlight    at #ffe1a3  derived   # <mark> foreground\npoint onAccent     at #0a0d14  derived   # text on filled accents\n\n# ---- surfaces: even lightness ramp, canvas hue, no chroma drift ---------\ndL canvas surface1 = stepL                   # holds \u00b10.02 (see \u00a73.4)\ndL surface1 surface2 = stepL\nlock H coolGray surface1 surface2 weight 0.3 # surfaces sit on 259\u2013266\u00b0\nlock C surface1 surface2\ndC canvas surface2 = 0                       # measured 0.013 vs 0.013\n\n# ---- reading family: one hue and chroma, lightness by contrast ---------\nlock H coolGray text textMuted border\nlock C coolGray text textMuted border weight 0.5\nL text = 0.936                               # pin: keep today's body text, do not let -> min lift it\ncontrast text canvas       >= 7              # AAA body text (currently 15.6:1)\ncontrast text surface2     >= 7              # cards / modal body (currently 12.4:1)\ncontrast textMuted canvas  >= mutedC         # AA (currently 6.0:1)\ncontrast textMuted surface2 >= 4.5           # AA on cards (currently 4.2:1 \u2014 FAILS)\ncontrast border canvas     >= 3              # UI component floor (currently 2.0:1 \u2014 FAILS)\ndistance canvas textMuted  -> min weight 0.05\ndistance canvas border     -> min weight 0.05\n\n# ---- links and brand states --------------------------------------------\nlock H brand link\nlock C brand link\ncontrast link canvas >= 4.5                  # currently 8.2:1\ndistance link brand -> min weight 0.2        # links are the brand colour today\nlock H brand brandHover\ndL brand brandHover = hoverStep\ndC brand brandHover = -0.029                 # measured 0.137 \u2192 0.108\ncontrast brandHover canvas >= 4.5\n\n# ---- violet accent ------------------------------------------------------\ndH brand accent2 = 52                        # measured 250.7\u00b0 \u2192 302.7\u00b0\nlock L brand accent2 weight 0.3              # 70.4% vs 72.2% \u2014 soft\nC accent2 = accent2C\ncontrast accent2 canvas >= 4.5               # currently 7.6:1\nlock C accent2 accent2Hover\ndL accent2 accent2Hover =  and the ramp even.\n* every token in the **light** theme, which has no observed values at all.\n\n**Preview templates.** `preview.css` / `preview.html` exercise the nav + hero + card-ramp + browse-chip surfaces of the real site in one screenful: `canvas` behind everything, `surface1` for the sticky bar, `surface2` for the card and the nested modal body, `border` on every hairline, `text`/`textMuted`/`link` in prose, `brand`/`brandHover` on the launch button and its hover, `accent2`/`accent2Hover` on the tag chip, `success`/`warning` on the category badges, `highlight` inside `<mark>`, `onAccent` as the text of both filled controls.",

    "replacements": "Replace the literals in place; the `:root` blocks of `css/style.css` and `css/home.css` become thin aliases onto the generated tokens (see *Theme plumbing*).\n\n| literal | where | property | token | replacement |\n|---|---|---|---|---|\n| `#0d1117` | style.css `:root --bg` \u00d71 | custom prop | `surface1` | `--bg: var(--color-surface-1)` |\n| `#161b22` | style.css `:root --surface` \u00d71 | custom prop | `surface2` | `--surface: var(--color-surface-2)` |\n| `#30363d` | style.css `:root --border` \u00d71 | custom prop | `border` | `--border: var(--color-border)` |\n| `#58a6ff` | style.css `:root --accent` \u00d71 | custom prop | `brand` | `--accent: var(--color-brand)` |\n| `#bc8cff` | style.css `:root --accent2` \u00d71 | custom prop | `accent2` | `--accent2: var(--color-accent-2)` |\n| `#e6edf3` | style.css `:root --text` \u00d71 | custom prop | `text` | `--text: var(--color-text)` |\n| `#8b949e` | style.css `:root --text-muted` \u00d71 | custom prop | `textMuted` | `--text-muted: var(--color-text-muted)` |\n| `#7ee787` | home.css `:root --accent3` \u00d71 | custom prop | `success` | `--accent3: var(--color-success)` |\n| `#ffa657` | home.css `:root --accent4` \u00d71 | custom prop | `warning` | `--accent4: var(--color-warning)` |\n| `rgba(13,17,23,.9)` | style.css `nav` \u00d71 | background | `surface1` | `background: color-mix(in oklab, var(--color-surface-1) 90%, transparent)` |\n| `rgba(13,17,23,.55)` | home.css `nav` \u00d71 | background | `surface1` | `color-mix(in oklab, var(--color-surface-1) 55%, transparent)` |\n| `rgba(13,17,23,.82)` | browse.css `.browse-bar` \u00d71 | background | `surface1` | `color-mix(in oklab, var(--color-surface-1) 82%, transparent)` |\n| `rgba(22,27,34,.55)` | home.css `--surface-glass` \u00d71 | custom prop | `surface2` | `color-mix(in oklab, var(--color-surface-2) 55%, transparent)` |\n| `rgba(22,27,34,.78)` | home.css `--surface-glass-strong` \u00d71 | custom prop | `surface2` | `color-mix(in oklab, var(--color-surface-2) 78%, transparent)` |\n| `#0a0d14` | home.css `body` gradient base \u00d71 | background | `canvas` | `var(--color-canvas)` |\n| `#0a0d14` | home.css \u00d74, browse.css \u00d73 (`.btn-primary`, `.featured-card-launch`, `.modal-launch`, `.entry-open`, `.cat-tab[aria-selected]`, `.tag-chip[aria-pressed]`) | color | `onAccent` | `color: var(--color-on-accent)` |\n| `#0d1117` | style.css `.btn-primary` \u00d71 | color | `onAccent` | `color: var(--color-on-accent)` |\n| `#58a6ff` | home.css \u00d74 (brand glyph, footer mark, aurora blob 1), browse.css \u00d71 | gradient stop / background | `brand` | `var(--color-brand)` |\n| `#79b8ff` | home.css \u00d72, browse.css \u00d71 (launch gradients) | gradient stop | `brandHover` | `var(--color-brand-hover)` |\n| `#79c0ff` | browse.css `.entry-badge.is-cat-lab` \u00d71 | color | `brandHover` | `color: var(--color-brand-hover)` |\n| `#6ea8fe` | home.css `.nav-section-link::after` \u00d71 | gradient stop | `brandHover` | `var(--color-brand-hover)` |\n| `#bc8cff` | home.css \u00d73 (brand glyph, footer mark, aurora blob 2) | gradient stop / background | `accent2` | `var(--color-accent-2)` |\n| `#a78bff` | browse.css `.cat-tab[aria-selected]` \u00d71 | gradient stop | `accent2Hover` | `var(--color-accent-2-hover)` |\n| `#b78cff` | home.css \u00d72 (`.nav-section-link::after`, `.is-active`) | gradient stop / color | `accent2Hover` | `var(--color-accent-2-hover)` |\n| `#cdd6ff` | home.css `.back-to-top` \u00d71 | color | `accent2Hover` | `color: var(--color-accent-2-hover)` \u2014 or keep literal, see \u00a710 |\n| `#7ee787` | home.css `.aurora-blob-3` \u00d71 | gradient stop | `success` | `var(--color-success)` |\n| `#ffa657` | home.css `.hero-title-accent` \u00d71 | gradient stop | `warning` | `var(--color-warning)` |\n| `#ffe1a3` | browse.css `.entry-card mark` \u00d71 | color | `highlight` | `color: var(--color-highlight)` |\n| `rgba(255,212,121,.24)` | browse.css `.entry-card mark` \u00d71 | background | `highlight` | `color-mix(in oklab, var(--color-highlight) 24%, transparent)` |\n| `rgba(88,166,255,\u2026)` \u00d7~18 | home.css, browse.css | border / bg / glow | `brand` | `color-mix(in oklab, var(--color-brand) N%, transparent)` |\n| `rgba(188,140,255,\u2026)` \u00d7~10 | home.css, browse.css | border / bg / glow | `accent2` | `color-mix(in oklab, var(--color-accent-2) N%, transparent)` |\n| `rgba(126,231,135,.3)` | browse.css \u00d71 | border | `success` | `color-mix(in oklab, var(--color-success) 30%, transparent)` |\n| `rgba(255,166,87,.3)` | browse.css \u00d71 | border | `warning` | `color-mix(in oklab, var(--color-warning) 30%, transparent)` |\n| `rgba(121,192,255,.3)` | browse.css \u00d71 | border | `brandHover` | `color-mix(in oklab, var(--color-brand-hover) 30%, transparent)` |\n| `#fff` | browse.css `.btn`-like fill \u00d71, videos.css \u00d71 | color | \u2014 | keep literal |\n| `#05050c` | videos.css \u00d73 | background | \u2014 | keep literal (video letterbox) |\n| `rgba(0,0,0,\u2026)` \u00d7~14 | home.css, browse.css | box-shadow / scrim | \u2014 | keep literal (shadows) |\n| `rgba(255,255,255,\u2026)` \u00d7~40 | all files | hairline borders, chip fills | \u2014 | keep literal (neutral overlays) |\n\n**Deletions.** There are no per-theme override blocks today (the site is dark-only), so nothing is deleted at this step. Once the light theme ships, delete any ad-hoc lightening that the tokens now handle \u2014 in particular the hard-coded `#0a0d14` foregrounds listed above must *all* become `var(--color-on-accent)`, or the light theme will paint near-black text on a near-white button.",

    "plumbing": "The stylesheets have **no** theme mechanism today: everything lives in `:root` of `css/style.css` (with `css/home.css` adding more root variables). Adopt the emitted blocks as follows.\n\n1. Load the generated file **first**, before every other stylesheet:\n   ```html\n   <link rel=\"stylesheet\" href=\"css/mathematical-explorations-tokens.css\" />\n   <link rel=\"stylesheet\" href=\"css/style.css\" />\n   <link rel=\"stylesheet\" href=\"css/home.css\" />   <!-- or browse.css / videos.css -->\n   ```\n2. Keep the legacy variable names as aliases in `css/style.css` so no selector has to change on day one:\n   ```css\n   :root {\n     color-scheme: dark light;   /* NEW \u2014 form controls + scrollbars follow the theme */\n     --bg:          var(--color-surface-1);\n     --surface:     var(--color-surface-2);\n     --border:      var(--color-border);\n     --accent:      var(--color-brand);\n     --accent2:     var(--color-accent-2);\n     --text:        var(--color-text);\n     --text-muted:  var(--color-text-muted);\n     /* home.css */\n     --accent3:     var(--color-success);\n     --accent4:     var(--color-warning);\n     --accent-glow:  color-mix(in oklab, var(--color-brand) 45%, transparent);\n     --accent2-glow: color-mix(in oklab, var(--color-accent-2) 35%, transparent);\n     --border-glow:  color-mix(in oklab, var(--color-brand) 25%, transparent);\n     --surface-glass:        color-mix(in oklab, var(--color-surface-2) 55%, transparent);\n     --surface-glass-strong: color-mix(in oklab, var(--color-surface-2) 78%, transparent);\n   }\n   ```\n3. `switchMode` is `media,attribute`: the emitter writes `:root` (dark, the default), `@media (prefers-color-scheme: light) { :root { \u2026 } }` and `[data-theme=\"dark\"|\"light\"]`. Because the site is dark-first, set `defaultTheme: dark` (already configured) so a visitor with no preference keeps today's look.\n4. For an explicit switcher, set `document.documentElement.dataset.theme = 'light' | 'dark'` \u2014 the attribute blocks are emitted last and win over the media query. Persist the choice in `localStorage`.\n5. `body`'s two radial gradients in `css/home.css` (`#0f1626`, `#181024`) are decorative atmosphere, not tokens; when the light theme lands, wrap them in the attribute selector or rebuild them with `color-mix(in oklab, var(--color-brand) 12%, var(--color-canvas))`.",

    "alpha": "The design leans heavily on translucency; three mechanisms cover every case.\n\n**1. Token tints \u2192 `color-mix`.** Any `rgba()` whose RGB triple matches a token becomes a mix with `transparent` at the same percentage:\n\n```css\n/* before */ border: 1px solid rgba(88, 166, 255, 0.25);\n/* after  */ border: 1px solid color-mix(in oklab, var(--color-brand) 25%, transparent);\n\n/* before */ background: rgba(188, 140, 255, 0.06);\n/* after  */ background: color-mix(in oklab, var(--color-accent-2) 6%, transparent);\n```\n\nThis applies to all `--accent-glow` / `--accent2-glow` / `--border-glow` definitions, the badge borders in `browse.css`, the tag chips, and the sticky-bar backgrounds.\n\n**2. Shade variants that were not promoted to tokens \u2192 relative colour syntax.** The one-off hover lightenings can be derived instead of hard-coded:\n\n```css\n.entry-open:hover { background: oklch(from var(--color-brand) calc(l + 0.04) c h); }\n.tag-chip:hover  { border-color: oklch(from var(--color-accent-2) l calc(c * 0.8) h); }\n```\n\nUse this only where the value is *not* in the token map \u2014 `brandHover` and `accent2Hover` already exist and must be used directly.\n\n**3. Keep literal.** Neutral scrims and shadows stay as written: `rgba(0,0,0,\u2026)` in every `box-shadow`, `rgba(255,255,255,0.02\u20130.16)` hairlines and chip fills, `rgba(5,7,11,0.78)` modal scrim, `#05050c` video letterbox. They are luminance effects, not palette colours; mixing them with the canvas token would make glass panels muddy in the light theme. Revisit only the modal scrim, which should become `color-mix(in oklab, var(--color-canvas) 78%, transparent)` when the light theme ships.",

    "skip": "Not tokenised, deliberately:\n\n* `currentColor` (`.cat-tab .cat-count`, `.entry-badge` inheritance) \u2014 already relative.\n* `transparent` (~30 occurrences: gradient tails, mask stops, `.btn-secondary`, `.tag-more`) \u2014 not a colour.\n* `black` inside `mask-image` / `-webkit-mask-image` in `css/home.css` \u2014 a mask stop, ignored by the palette.\n* All `rgba(255,255,255,\u2026)` hairlines, chip fills and the skeleton sweep gradient \u2014 neutral light overlays; they read correctly against any dark surface and are re-evaluated (not re-coloured) when the light theme lands.\n* All `rgba(0,0,0,\u2026)` shadows and input wells \u2014 depth cues.\n* `#05050c` (videos.css, \u00d73) \u2014 the `<video>` element's own letterbox; intentionally darker than `canvas`.\n* `#fff` on `.featured-card-play:focus-visible` and `.back-to-top:hover` \u2014 a deliberate maximum-contrast highlight.\n* `rgba(150,160,255,\u2026)` / `rgba(180,190,255,\u2026)` / `rgba(120,130,255,\u2026)` in `css/videos.css` \u2014 a cool blue-violet halfway between `brand` and `accent2`, used only on the media frame. Tokenising it would need a 14th hue with no other consumer; left literal and noted in \u00a710.\n* `#0f1626` and `#181024` (`body` background gradient, `css/home.css`) \u2014 atmosphere stops, see *Theme plumbing* step 5.",

    "order": "Work in this order; after each step the dark page must look identical (solve with the `-> min` objectives disabled to verify).\n\n1. **Ship the token file.** Add `mathematical-explorations-tokens.css` and load it before `style.css` on every page (`index.html`, `browse.html`, each experiment page). Nothing changes visually \u2014 nothing consumes the tokens yet.\n2. **Alias the legacy variables.** Rewrite the `:root` blocks of `style.css` and `home.css` per *Theme plumbing* step 2. All four stylesheets now render from the solved palette; diff screenshots here.\n3. **Replace the remaining literals.** Work file by file in the order of the replacement table \u2014 gradient stops in `home.css`, badge colours in `browse.css`, the `#0a0d14` foregrounds everywhere. This is the bulk of the change and is purely mechanical.\n4. **Convert the tints.** Turn every `rgba()` of a token colour into `color-mix(in oklab, \u2026)` (\u00a77 item 1). Leave shadows and white hairlines alone.\n5. **Add `color-scheme: dark light`** to `:root` so native controls, scrollbars and form widgets follow.\n6. **States.** Point every `:hover` / `:focus-visible` / `[aria-selected]` / `[aria-pressed]` rule at `brandHover` / `accent2Hover` instead of its literal, or at relative colour syntax (\u00a77 item 2).\n7. **Fix the findings.** Accept the solver's brighter `border` (F2) and the muted-text lift (F1); re-check `.hero-hint` and `.tag-row-label` opacity (F3).\n8. **Enable the light theme.** Un-mark `theme light` as proposed, re-solve, review the emitted light block, then handle the two `body` gradient stops and the modal scrim.\n9. **Remove the fallbacks.** Once the token file ships unconditionally, drop the `var(--color-x, <old literal>)` second arguments from the preview and from any code that adopted them.",

    "findings": "**Accessibility**\n\n* **F1 \u2014 `textMuted` on `surface2` measures 4.2:1**, below the 4.5:1 AA floor for normal text. This pair occurs constantly: `.card p`, `.controls label`, `.modal-body`, `.entry-sub`, `.entry-pitch`, `.readme-preview`, `footer p`. The floor is written; the solver lifts `textMuted` by \u2248 0.015 L, which also nudges it on the canvas (6.0:1 \u2192 6.3:1).\n* **F2 \u2014 `border` on `canvas` measures 2.0:1**, below the 3:1 non-text floor. `--border` is the hairline of every card, nav, control panel and footer divider. The floor is written and the solver lifts `border` from `L 36.4%` to \u2248 `L 41%`. This is the one deliberate visual change the sketch imposes; if the softer hairline is preferred, downgrade to `contrast border canvas >= 1.8` and record the exception.\n* **F3 \u2014 opacity-dimmed text.** `.hero-hint` (opacity 0.7), `.tag-row-label` (0.7), `.empty-glyph` (0.35) and `.hero-scroll` (0.5) reduce an already-muted colour further; the effective ratios fall to \u2248 4.0:1, 4.0:1 and below. Opacity is outside the palette model, so no constraint is written \u2014 either raise the opacity to 1 and rely on `textMuted`, or introduce a `textFaint` token with its own 4.5:1 floor.\n\n**Clustering decisions**\n\n* **C9** merges `#79b8ff`, `#79c0ff` and `#6ea8fe` (pairwise \u0394E_ok \u2264 0.019). They are three hand-tuned spellings of \u201clighter brand\u201d; one `brandHover` token replaces all three. The largest single shift is `#6ea8fe` \u2192 solved value, \u2248 \u0394E 0.014.\n* **C10** merges `#a78bff`, `#b78cff` and `#cdd6ff` **aggressively**: the first two are \u0394E 0.011 apart, but `#cdd6ff` (the `.back-to-top` glyph) is \u0394E 0.13 away \u2014 far lighter and far less saturated. It was folded in because it is a single decorative occurrence with no other home. If the back-to-top button should keep its pale tint, leave that one literal or add a `textOnOverlay` token.\n* **`link` is currently identical to `brand`.** The sketch keeps them as separate points joined by `lock H` / `lock C` and `distance link brand -> min`, so the solver collapses them in the dark theme (expected) while the light theme is free to darken the link for its 4.5:1 floor. The collapse is acceptable, not a bug.\n\n**Near-neutral hues**\n\n* `text` (C 0.0096), `border` (C 0.0118) and the two surfaces (C 0.0128) are all below or near the C < 0.02 reliability threshold, so their measured hues (238.7\u00b0\u2013265.8\u00b0, a 27\u00b0 spread) are numerically meaningless. Hue is taken from the `coolGray` orientation point (255\u00b0) for the reading family and from `canvas` for the surfaces \u2014 not from the greys themselves. Expect the emitted greys to read very slightly bluer than `#e6edf3` and very slightly warmer than `#30363d`.\n\n**Proposed, not found**\n\n* **The `light` theme is entirely proposed.** No `prefers-color-scheme`, `[data-theme]` or `.dark` selector exists anywhere in the four stylesheets; `theme light` contains anchors, orientation points and derived *seeds* only, and every value it emits is solver output. Review it before shipping \u2014 in particular the glass surfaces and the aurora blobs, which were designed for a dark canvas and will need their own treatment.\n\n**Rules deliberately not written**\n\n* No relation ties `success` and `warning` to each other (measured `L` 85.4% vs 79.1%, a 6-point gap with no pattern); they are pinned only by their hue offset from `brand` and their contrast floors.\n* No token for the `rgba(150,160,255,\u2026)` family in `css/videos.css` \u2014 see *Do not tokenise*.\n* The two `body` gradient stops `#0f1626` / `#181024` are not points: they are blurred atmosphere at 60 % falloff, and constraining them would over-determine the canvas.\n* Gamut: every anchor and every observed literal is inside sRGB; `gamut srgb` adds no active constraint today, but stays on so the proposed light theme cannot drift out.",

    "preview": {
      "css": "body { margin: 0; padding: 24px; font: 14px/1.6 'Inter', system-ui, sans-serif;\n  background: var(--color-canvas, #0a0d14); color: var(--color-text, #e6edf3); }\nh2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.02em; }\n.muted { color: var(--color-text-muted, #8b949e); }\na { color: var(--color-link, #58a6ff); }\nmark { background: color-mix(in oklab, var(--color-highlight, #ffe1a3) 24%, transparent);\n  color: var(--color-highlight, #ffe1a3); border-radius: 3px; padding: 0 0.15em; }\n.bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin: 0 0 16px;\n  background: var(--color-surface-1, #0d1117);\n  border: 1px solid var(--color-border, #30363d); border-radius: 10px; }\n.bar b { color: var(--color-brand, #58a6ff); }\n.card { background: var(--color-surface-2, #161b22);\n  border: 1px solid var(--color-border, #30363d); border-radius: 12px;\n  padding: 14px; margin: 12px 0; }\n.card .card { background: var(--color-surface-1, #0d1117); }\n.btn { display: inline-block; padding: 7px 14px; border-radius: 8px; font-weight: 600;\n  color: var(--color-on-accent, #0a0d14);\n  background: linear-gradient(135deg, var(--color-brand, #58a6ff), var(--color-brand-hover, #79b8ff)); }\n.btn:hover { background: var(--color-brand-hover, #79b8ff); }\n.chip { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px;\n  font-weight: 600; color: var(--color-on-accent, #0a0d14);\n  background: var(--color-accent-2, #bc8cff); }\n.chip:hover { background: var(--color-accent-2-hover, #a78bff); }\n.badge { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px;\n  letter-spacing: 0.09em; text-transform: uppercase; border: 1px solid; }\n.badge.ok { color: var(--color-success, #7ee787);\n  border-color: color-mix(in oklab, var(--color-success, #7ee787) 30%, transparent); }\n.badge.warn { color: var(--color-warning, #ffa657);\n  border-color: color-mix(in oklab, var(--color-warning, #ffa657) 30%, transparent); }\n",
      "html": "<div class=\"bar\"><b>\u2211 Explorations</b><span class=\"muted\">sticky nav on surface1</span></div>\n<h2>Mathematical Explorations</h2>\n<p>Body text on <code>canvas</code>. <span class=\"muted\">Secondary copy uses <code>textMuted</code>.</span> A <a href=\"#\">link</a> shares the brand hue, and search results <mark>highlight</mark> inline.</p>\n<div class=\"card\">\n  <b>surface2</b> \u2014 card, modal and panel background.\n  <div class=\"card\"><b>surface1</b> \u2014 nested well; the ramp is an even lightness step.</div>\n  <p class=\"muted\" style=\"margin:8px 0 0\">Muted text on surface2 \u2014 the pair that currently fails AA (finding F1).</p>\n</div>\n<p><span class=\"btn\">Launch \u2192</span> &nbsp; <span class=\"chip\">tag</span> &nbsp; <span class=\"badge ok\">game</span> <span class=\"badge warn\">essay</span></p>\n<p class=\"muted\">Every colour above is a solved point in OKLab \u2014 edit an anchor or a rule in the Script window and re-solve.</p>\n"
    }
  }
}

        // Adjust this single constant if the Point-CAD library lives elsewhere.

            el.textContent =
                'Could not load the theme-designer harness from "' + HARNESS_URL + '".\n' +
                'Edit HARNESS_URL at the bottom of this file to point at\n' +
                'extensions/theme/ui/harness.js, then reload.\n\n' + err;
        }
