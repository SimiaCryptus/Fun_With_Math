        "pcad": "# theme_design — Mathematical Explorations (Fun With Math)\n# One colour model, thirteen themes, named the way the people who play the\n# games name things: `mainMenu` is the theme found in the CSS; twelve are\n# proposed (`newGame`, `saveRoom`, `voidRunner`, `hardcoreMode`, `questLog`,\n# `finalBoss`, `hydroZone`, `synthwave`, `jungleBiome`, `rainbowRoad`,\n# `lavaLevel`, `powerUp`).\n#\n# COLOUR POLICY: this is a games site, so every proposed theme is deliberately\n# loud. Each canvas carries a visible tint (C 0.028–0.07 on the dark themes,\n# 0.008–0.03 on the light ones — roughly the ceiling before the far end of the\n# ramp leaves sRGB) and each brand sits near the sRGB chroma edge for its hue.\n# `gamut srgb` is the backstop and is expected to be *active* on `synthwave`,\n# `jungleBiome`, `rainbowRoad` and `powerUp`: a chroma that comes back a little\n# under its seed there is the gamut doing its job, not a pin failure.\n# Two exceptions on purpose: `mainMenu` is untouched (it must still reproduce\n# the shipped CSS) and `hardcoreMode` keeps near-zero-chroma greys, because its\n# job is legibility, not colour.\n#\n# TOKEN NAMES: the emitter writes `--color-<point name>` (canvas →\n# --color-canvas, textMuted → --color-text-muted) UNLESS the point carries a\n# `label`, in which case the label wins. preview.css and the integration\n# plumbing read --color-canvas / --color-brand, so no exported point may be\n# labelled — see the note above the inputs for what happens when one is.\nspace oklab\nunits none deg\ngamut srgb\n\n# ---- variables ----------------------------------------------------------\n# Every theme-dependent number is a variable, so a theme block flips a sign\n# or raises a floor without touching a rule. Sign convention: positive steps\n# move away from the canvas on dark themes, negative on light ones.\n# `locked` = not solver-adjustable (a theme may still set it).\n#\n# The design inputs (canvas, brand, coolGray) are *pinned* points: each axis\n# is held by a `locked` variable that every theme block sets. A pin needs\n# BOTH of the following, and the pins MUST keep both:\n#   1. the variable is `locked` — otherwise `L canvas = canvasL` is an\n#      equation between two unknowns and the solver satisfies it by dragging\n#      the variable to wherever the point drifts;\n#   2. the pin rule carries `weight 20` — otherwise it is a weight-1 residual\n#      measured in L units (a 0.04 miss costs 0.0016) competing with contrast\n#      residuals measured in ratio units (a 0.5 miss costs 0.25), and the\n#      least-squares compromise always sacrifices the pin. That is exactly\n#      what an earlier emit showed: the light-theme floors pushed the *canvas*\n#      brighter (newGame L 102.2%, questLog L 98.6% — both outside sRGB, which\n#      the preview paints as near-black) instead of pulling the accents darker;\n#      newGame's ramp stretched to 6.9-pt steps and mainMenu's canvas chroma\n#      drifted 0.0131 → 0.0150 for the same reason. At weight 20 a pin costs\n#      400× more to violate than any single floor, so the canvas stays put and\n#      the accents move.\n# (Anchors do not work either: a theme block cannot re-anchor a fixed literal.)\nvar canvasL     = 0.1547 locked    # body base #0a0d14 = oklch(15.47% 0.0131 266.2)\nvar canvasC     = 0.0131 locked\nvar canvasH     = 266.2  locked\nvar brandL      = 0.704  locked    # --accent #58a6ff = oklch(70.41% 0.1368 250.7)\nvar brandC      = 0.137  locked\nvar brandH      = 250.7  locked\nvar grayL       = 0.60   locked    # reading gray: hue/chroma shared by text, muted, border\nvar grayC       = 0.015  locked\nvar grayH       = 255    locked\nvar stepL       = 0.041  locked    # surface ramp: canvas→surface1 +0.023, surface1→surface2 +0.059 (locked at the mean)\nvar textL       = 0.936  locked    # body-text lightness pin (observed 93.588%)\nvar bodyC       = 7      locked    # body text floor (AAA)\nvar mutedC      = 4.5    locked    # secondary text floor (AA; measured 6.0:1 on canvas)\nvar uiC         = 3      locked    # non-text UI floor (hairlines, hover fills)\nvar accent2C    = 0.165  locked    # chip saturation, per theme (was `shared`: a blue- or cyan-leaning accent2 at L 74–80% must drop to ≈0.13–0.16 to stay in sRGB, and one shared value would have dulled every theme for the sake of one)\nvar hoverStep   = 0.069  locked    # brand→brandHover measured +0.069 L\nvar hoverDC     = -0.029 locked    # brand→brandHover measured 0.137 → 0.108 C (hover desaturates)\nvar a2HoverStep = -0.026 locked    # accent2→accent2Hover measured −0.026 L\nvar a2HoverDH   = -12    locked    # accent2→accent2Hover measured 302.7° → 290.9°\nvar a2DH        = 52     locked    # brand→accent2 hue offset, measured 250.7° → 302.7°\nvar successDH   = -103   locked    # brand→success, measured 250.7° → 147.9°\nvar warningDH   = 166    locked    # brand→warning, measured 250.7° → 56.9° (shortest arc)\n# The three offsets are what make a brandH change re-colour the whole accent\n# family. A theme that moves brandH a little (voidRunner, 205°) leaves them\n# alone and lets the family rotate with it; a theme that moves it far\n# (saveRoom 190°, hardcoreMode 95°, finalBoss 340°, hydroZone 195°, synthwave\n# 345°, jungleBiome 145°, rainbowRoad 330°, lavaLevel 45°, powerUp 355°)\n# re-sets them so success stays green-to-teal, warning stays warm and accent2\n# lands on a deliberate complementary hue for the new brand.\n\n# ---- inputs (pinned by the locked variables above) ----------------------\n# NO `label` ON THESE THREE. The previous revision labelled them (body base,\n# --accent, reading gray) and the emitter named the tokens after the labels:\n# --color-body-base, --color-accent, --color-reading-gray. preview.css reads\n# var(--color-canvas, #0a0d14) and var(--color-brand, #58a6ff); with the\n# names mismatched every theme fell back to the DARK LITERALS baked into the\n# template — newGame and questLog rendered on a near L canvas surface1 = stepL weight 5          # holds ±0.02 (see §3.4); weighted so a floor moves the foreground, not the ramp\ndL surface1 surface2 = stepL weight 5\nlock H canvas surface1 surface2 weight 0.3   # surfaces take the canvas hue: finalBoss / questLog / lavaLevel tint the whole ramp\nlock C canvas surface1 surface2              # measured 0.0131 / 0.0127 / 0.0128 — the ramp shares the canvas chroma, so a saturated canvas makes saturated cards\n\n# ---- reading family: one hue and chroma, lightness by contrast ---------\nlock H coolGray text textMuted border\nlock C coolGray text textMuted border weight 0.5\nL text = textL weight 20                     # pin: keep today's body text; flips to ~0.24 on light themes\ncontrast text canvas        >= bodyC         # AAA body text (currently 15.6:1)\ncontrast text surface1      >= bodyC         # nav / browse-bar copy (currently ≈14:1)\ncontrast text surface2      >= bodyC         # cards / modal body (currently 12.4:1)\ncontrast textMuted canvas   >= mutedC        # AA (currently 6.0:1)\ncontrast textMuted surface1 >= mutedC        # nav secondary copy (currently ≈5.8:1)\ncontrast textMuted surface2 >= mutedC        # AA on cards (currently 4.2:1 — FAILS)\ncontrast border canvas      >= uiC           # UI component floor (currently 2.0:1 — FAILS)\n# textMuted and border are seeded at their floors; the contrast rules lift\n# them only where a seed falls short (F1, F2). No `-> min` pull toward the\n# canvas: the canvas is a pinned, solver-visible point and the pull would\n# only add residual.\n\n# ---- links and brand states --------------------------------------------\nlock H brand link\nlock C brand link\ncontrast link canvas   >= 4.5                # currently 8.2:1\ncontrast link surface2 >= 4.5                # body links inside cards and the modal (currently 6.6:1)\ndistance link brand -> min weight 0.2        # links are the brand colour today\nlock H brand brandHover\ndL brand brandHover = hoverStep\ndC brand brandHover = hoverDC\ncontrast brandHover canvas   >= 4.5\ncontrast brandHover surface2 >= uiC          # hover fill / gradient stop on cards\n\n# ---- second accent (tag chips) -----------------------------------------\ndH brand accent2 = a2DH                      # measured 250.7° → 302.7°\nlock L brand accent2 weight 0.3              # 70.4% vs 72.2% — soft\nC accent2 = accent2C\ncontrast accent2 canvas   >= 4.5             # currently 7.6:1\ncontrast accent2 surface2 >= 4.5             # tag chips live on cards (currently 6.9:1)\nlock C accent2 accent2Hover\ndL accent2 accent2Hover = a2HoverStep\ndH accent2 accent2Hover = a2HoverDH\ncontrast accent2Hover canvas >= 4.5          # active nav link must stand on its own (currently 7.0:1)\n\n# ---- status hues --------------------------------------------------------\ndH brand success = successDH                 # 250.7° → 147.9°\ndH brand warning = warningDH                 # 250.7° → 56.9° (shortest arc)\nlock L success warning weight 0.1            # soft: comparable badge weight in proposed themes; too weak to close the mainMenu 6-pt gap\ncontrast success canvas   >= 4.5             # currently 11.9:1\ncontrast warning canvas   >= 4.5             # currently 9.8:1\ncontrast success surface2 >= 4.5             # category badges sit on entry cards (9.6:1)\ncontrast warning surface2 >= 4.5             # (7.9:1)\ndH warning highlight = 28                    # <mark> is a lighter, softer warning\ncontrast highlight canvas   >= bodyC\ncontrast highlight surface2 >= 4.5           # marks appear inside .entry-card (11.4:1)\n\n# ---- text on filled controls -------------------------------------------\nlock L canvas onAccent weight 10\nlock C canvas onAccent weight 10\nlock H canvas onAccent weight 10\ncontrast onAccent brand        >= 4.5\ncontrast onAccent brandHover   >= 4.5        # hover keeps its label legible\ncontrast onAccent accent2      >= 4.5\ncontrast onAccent accent2Hover >= 4.5\ncontrast onAccent success      >= 4.5        # filled game badge\ncontrast onAccent warning      >= 4.5        # filled essay badge\n\n# ---- themes -------------------------------------------------------------\n# Theme blocks set variables and re-seed points only; every rule above\n# applies unchanged to all thirteen. The `canvas` / `brand` / `coolGray`\n# lines inside a block are seeds that match that theme's pins, so the solver\n# starts on the answer instead of walking there from the mainMenu values.\n#\n# Every other seed is placed *inside* every floor of its own canvas with\n# ≈0.01–0.02 L to spare (light-polarity accents at L ≤ 50% so they clear\n# 4.5:1 on a surface2 of ≈89–91%; dark-polarity hairlines at the L that gives\n# 3:1 on that canvas). Starting with no unmet rule means nothing tugs on the\n# pins, and every proposed theme should solve within ΔE 0.05 of its seeds —\n# except where `gamut srgb` trims a chroma that was seeded at the edge on\n# purpose.\n#\n# Diversity: the twelve proposed brands sit around the hue wheel — newGame\n# 252° (blue), saveRoom 190° (teal), voidRunner 205° (electric cyan),\n# hardcoreMode 95° (yellow), questLog 248° (ink blue), finalBoss 340° (pink),\n# hydroZone 195° (aqua), synthwave 345° (neon magenta), jungleBiome 145°\n# (leaf green), rainbowRoad 330° (magenta), lavaLevel 45° (tangerine), powerUp\n# 355° (raspberry) — and the dark canvases differ in lightness (5 / 7 / 12 /\n# 17 / 18 / 20 / 22 / 30%), tint (near-neutral only on hardcoreMode; slate,\n# indigo-black, indigo, navy, violet, forest and plum everywhere else) and\n# ramp width, instead of being near-clones of #0a0d14. The four light canvases\n# are tinted too: newGame cool, questLog sepia, rainbowRoad lavender-pink and\n# powerUp mint.\n# (If they still look alike in the Preview window, check the emitted token\n# names first: a preview that never receives --color-canvas / --color-brand\n# paints every theme on the dark fallback literals.)\n\ntheme mainMenu {                              # found: the entire current design, the screen every visitor lands on\n  var canvasL     = 0.1547\n  var canvasC     = 0.0131\n  var canvasH     = 266.2\n  var brandL      = 0.704\n  var brandC      = 0.137\n  var brandH      = 250.7\n  var grayL       = 0.60\n  var grayC       = 0.015\n  var grayH       = 255\n  var stepL       = 0.041\n  var textL       = 0.936\n  var hoverStep   = 0.069\n  var hoverDC     = -0.029\n  var a2HoverStep = -0.026\n}\n\ntheme newGame {                               # proposed — the clean daylight start screen; no light scheme exists in the CSS\n  var canvasL     = 0.985\n  var canvasC     = 0.008                     # even the calm theme is tinted, not paper-white\n  var canvasH     = 250\n  var brandL      = 0.50                      # ≤ 50.8% so link (= brand) clears 4.5:1 on surface2 (L 91.5%)\n  var brandC      = 0.17\n  var brandH      = 252\n  var grayL       = 0.45\n  var grayC       = 0.02\n  var grayH       = 255\n  var stepL       = -0.035                    # ramp descends from a bright canvas\n  var textL       = 0.24\n  var hoverStep   = -0.07                     # hover darkens on light canvases\n  var hoverDC     = -0.01\n  var a2HoverStep = -0.05\n  # seeds only — every point on the correct side of the canvas, inside its floors\n  canvas       at oklch(98.5% 0.008 250)\n  brand        at oklch(50% 0.17 252)\n  coolGray     at oklch(45% 0.02 255)\n  surface1     at oklch(95% 0.008 250)\n  surface2     at oklch(91.5% 0.008 250)\n  border       at oklch(63% 0.02 255)         # 3:1 on a near-white canvas needs L ≤ 65% (see §10)\n  text         at oklch(24% 0.02 255)\n  textMuted    at oklch(47% 0.02 255)         # 4.5:1 on surface2 needs L ≤ 50%\n  link         at oklch(50% 0.17 252)\n  brandHover   at oklch(43% 0.16 252)\n  accent2      at oklch(47% 0.165 304)\n  accent2Hover at oklch(42% 0.165 292)\n  success      at oklch(46% 0.14 149)         # greens carry more Y per L: 4.5:1 on surface2 needs L ≤ 47%\n  warning           "summary": "**4 stylesheets scanned** — `css/style.css`, `css/home.css`, `css/browse.css`, `css/videos.css`.\n\n* ~180 colour literals (including translucent overlays and gradient stops)\n* **13 distinct opaque clusters** after merging at ΔE_ok ≤ 0.02\n* **1 theme found** (`mainMenu` — the whole site as it ships), **12 themes proposed** (`newGame`, `saveRoom`, `voidRunner`, `hardcoreMode`, `questLog`, `finalBoss`, `hydroZone`, `synthwave`, `jungleBiome`, `rainbowRoad`, `lavaLevel`, `powerUp`)\n* **13 tokens** defined, all exported\n* **3 accessibility findings** (see §10)\n\n**Naming.** This is a games site, so the themes are named in the lexicon the audience already uses — `mainMenu` (the screen you land on, i.e. today's design), `newGame`, `saveRoom`, `voidRunner`, `hardcoreMode`, `questLog`, `finalBoss`, `hydroZone`, `synthwave`, `jungleBiome`, `rainbowRoad`, `lavaLevel`, `powerUp`. The names are the switch values (`data-theme=\"synthwave\"`) and the labels in the theme picker; nothing in the model depends on them.\n\n**Colour policy.** The proposed palettes are deliberately loud. Every canvas carries a visible tint (C 0.028–0.07 on the dark themes, 0.008–0.03 on the light ones — about the ceiling before the far end of the ramp leaves sRGB), the surface ramp inherits that tint through `lock C/H canvas surface1 surface2`, and each brand sits close to the sRGB chroma edge for its hue. `gamut srgb` is the backstop and is expected to be *active* on `synthwave`, `jungleBiome`, `rainbowRoad` and `powerUp`. Two themes opt out on purpose: `mainMenu` is untouched so it still reproduces the shipped CSS, and `hardcoreMode` keeps near-zero-chroma greys because its job is legibility.\n\nThe design is already token-driven at the root (`css/style.css` `:root` defines `--bg`, `--surface`, `--border`, `--accent`, `--accent2`, `--text`, `--text-muted`; `css/home.css` adds `--accent3`, `--accent4`, glass surfaces and glows). This sketch keeps that vocabulary, renames it onto the `--color-*` scheme and makes the relations between the values explicit (surface ramp, chip offset from brand, status hues, hover steps) so further themes can be generated rather than hand-written.\n\nEvery theme-dependent number (`stepL`, `textL`, the contrast floors `bodyC` / `mutedC` / `uiC`, the hover steps, the three hue offsets `a2DH` / `successDH` / `warningDH`) is a **`locked`** variable, so a theme block only flips a sign, raises a floor or re-aims a hue — the rule set itself is identical for all thirteen themes. The three design inputs (`canvas`, `brand`, `coolGray`) are **pinned points** held by nine more `locked` variables (`canvasL/C/H`, `brandL/C/H`, `grayL/C/H`), and the pin rules carry **`weight 20`**. Three earlier revisions got this wrong in three different ways: `anchor`s cannot be re-anchored by a theme block; an *unlocked* pin (`L canvas = canvasL` with a free `canvasL`) is an equation between two unknowns that the solver satisfies by moving the variable; and a locked but *unweighted* pin is a weight-1 residual in L units that loses to every contrast residual in ratio units — that last one let the light-theme floors push the canvas brighter instead of the accents darker, so `newGame` emitted a canvas at L 102% and `questLog` at 98.6%, both outside sRGB, which the preview painted near-black. With the pins locked *and* weighted, and every proposed theme seeded inside its own floors, each theme's canvas is a hard fact.\n\nThe twelve proposed brands are spread round the hue wheel (newGame 252°, saveRoom 190° teal, voidRunner 205° cyan, hardcoreMode 95° yellow, questLog 248° ink blue, finalBoss 340° pink, hydroZone 195° aqua, synthwave 345° neon magenta, jungleBiome 145° leaf green, rainbowRoad 330° magenta, lavaLevel 45° tangerine, powerUp 355° raspberry), the dark canvases differ in lightness, tint and ramp width, and the four light canvases differ in tint (cool, sepia, lavender-pink, mint), so the themes read as different palettes rather than as one palette with the numbers nudged.",

erived | `#ffa657` `oklch(79.069% 0.13208 56.89)` | *derived* | C12 | `--accent4`, essay badge |\n| `highlight` | `--color-highlight` | derived | `#ffe1a3` `oklch(91.478% 0.07495 84.93)` | *derived* | C13 | `<mark>` foreground |\n| `onAccent` | `--color-on-accent` | derived | `#0a0d14` | *derived* | C8 | text on filled brand/accent controls; locked to `canvas` in every theme |\n\n`coolGray` is a pinned helper point (`grayL/C/H`) that carries the reading family's hue and chroma; it is not exported. Every cluster C1\u2013C13 is tokenised. Effect-only values are listed in \u00a78 (*Do not tokenise*).",

          "relations": "| rule | tokens | evidence (`mainMenu`) | status |\n|---|---|---|---|\n| `L/C/H canvas = canvasL/C/H` | canvas | `#0a0d14` = 15.47% / 0.0131 / 266.2° | **input pin** — the three variables are `locked`; each theme block sets them, so the canvas moves with the theme and the solver cannot move it back. (An `anchor` cannot be re-anchored by a theme block; an *unlocked* pin is not a pin at all — see §10, *Theme mechanics*) |\n| `L/C/H brand = brandL/C/H` | brand | `#58a6ff` = 70.41% / 0.137 / 250.7° | input pin, idem — every proposed theme moves `brandH`, which re-colours the whole accent family through the `dH` offsets |\n| `L/C/H coolGray = grayL/C/H` | coolGray | 60% / 0.015 / 255° (design decision, see below) | input pin, idem — `questLog` sets `grayH` 70 to warm the whole reading family; `rainbowRoad` sets it 320 to tint the greys purple |\n| `dL canvas surface1 = stepL` | canvas→surface1 | measured **+0.023** | holds loosely — `stepL` is locked at the mean of the two measured steps (0.041) |\n| `dL surface1 surface2 = stepL` | surface1→surface2 | measured **+0.059** | idem; both surfaces move ≈ΔE 0.02 so the ramp is even |\n| `lock H canvas surface1 surface2` (w 0.3) | surfaces | 265.75° / 264.37° vs canvas 266.18° | holds (±2°); a chromatic canvas (`finalBoss`, `questLog`, `hydroZone`, `jungleBiome`, `lavaLevel`, `synthwave`) tints the ramp — this is the main reason the loud themes read as whole palettes and not as one grey shell with coloured buttons |\n| `lock C canvas surface1 surface2` | ramp | 0.01312 / 0.01274 / 0.01279 | holds (±0.0004) — the whole ramp shares the canvas chroma |\n| `lock H coolGray text textMuted border` | reading family | 238.74° / 248.16° / 258.34° | **design decision** — all three are near-neutral (C ≤ 0.021), hue is unreliable; taken from the `coolGray` pin (255°) |\n| `lock C coolGray text textMuted border` (w 0.5) | reading family | 0.0096 / 0.0203 / 0.0118 | soft — pulls to `grayC`, which the loud themes rais s >= 4.5` | active nav link | 7.0:1 | holds — new: the hover/active state is legible on its own, not just because `accent2` is |\n| `dH brand success = −103` | brand→success | **−102.78°** | holds |\n| `dH brand warning = 166` | brand→warning | **+166.17°** (shortest arc) | holds |\n| `lock L success warning` (w 0.1) | badges | 85.4% vs 79.1% | **soft design decision** — too weak to close the observed 6-pt gap, strong enough to keep the two badges at comparable weight in the proposed themes |\n| `contrast success/warning canvas >= 4.5` | badges | 11.9:1 / 9.8:1 | holds |\n| `contrast success/warning surface2 >= 4.5` | badges on cards | 9.6:1 / 7.9:1 | holds — new; `.entry-badge` sits on `surface2`, not the canvas |\n| `dH warning highlight = 28` | warning→highlight | **+28.04°** | holds |\n| `contrast highlight canvas >= bodyC`, `contrast highlight surface2 >= 4.5` | `<mark>` | 14.2:1 / 11.4:1 | holds |\n| `lock L/C/H canvas onAccent` | onAccent | identical literal `#0a0d14` | holds — every theme seeds `onAccent` on its canvas |\n| `contrast onAccent brand/brandHover >= 4.5` | button text | 7.8:1 / 9.4:1 | holds |\n| `contrast onAccent accent2/accent2Hover >= 4.5` | chip text | 7.4:1 / 7.0:1 | holds |\n| `contrast onAccent success/warning >= 4.5` | filled badge text | 12.0:1 / 9.9:1 | holds — new; on light themes this is the rule that pulls `warning` down to L ≈ 54% |\n\nEvery point is determined on all three axes: the three inputs by one **locked** variable pin per axis; `surface1/2` by `dL` + `lock H` + `lock C`; the reading family by `lock H` + `lock C` + (`L text` pin | a seed placed at its contrast floor); the accent family by `dH` + `lock L`/`dL` + `C =`/`lock C`; `onAccent` by three locks. Because the floors are variables, `hardcoreMode` raises `mutedC` to 7 and `uiC` to 4.5 without adding a single rule; because the inputs are locked variables too, `newGame`, `questLog`, `rainbowRoad` and `powerUp` flip the canvas to L 95–98.5% and the dark themes each get their own canvas hue/chroma and brand hue without touching one.",

          "expected": "**Emitter output.** *Save CSS* writes `mathematical-explorations-tokens.css`:\n\n```css\n/* Point-CAD theme — 15 colours, themes: mainMenu, newGame, saveRoom, voidRunner, hardcoreMode, questLog, finalBoss, hydroZone, synthwave, jungleBiome, rainbowRoad, lavaLevel, powerUp */\n:root { /* mainMenu — defaultTheme */\n    --color-canvas: oklch(15.470% 0.01312 266.18);\n    --color-brand: oklch(70.412% 0.13675 250.72);\n    --color-surface-1: oklch(19.6% 0.0131 262.00);\n    --color-surface-2: oklch(23.7% 0.0131 262.00);\n    --color-border: oklch(48% 0.0150 255.00);\n    --color-text: oklch(93.600% 0.0150 255.00);\n    --color-text-muted: oklch(66.3% 0.0150 255.00);\n    --color-link: oklch(70.412% 0.13675 250.72);\n    --color-brand-hover: oklch(77.3% 0.10775 250.72);\n    --color-accent-2: oklch(70.6% 0.16500 302.72);\n    --color-accent-2-hover: oklch(68.0% 0.16500 291.06);\n    --color-success: oklch(85.4% 0.17004 147.94);\n    --color-warning: oklch(79.1% 0.13208 56.89);\n    --color-highlight: oklch(91.5% 0.07495 84.93);\n    --color-on-accent: oklch(15.470% 0.01312 266.18);\n}\n@media (prefers-color-scheme: light) { :root { /* newGame block */ } }\n[data-theme=\"mainMenu\"]     { /* same as :root */ }\n[data-theme=\"newGame\"]      { /* newGame block */ }\n[data-theme=\"saveRoom\"]     { /* saveRoom block */ }\n[data-theme=\"voidRunner\"]   { /* voidRunner block */ }\n[data-theme=\"hardcoreMode\"] { /* hardcoreMode block */ }\n[data-theme=\"questLog\"]     { /* questLog block */ }\n[data-theme=\"finalBoss\"]    { /* finalBoss block */ }\n[data-theme=\"hydroZone\"]    { /* hydroZone block */ }\n[data-theme=\"synthwave\"]    { /* synthwave block */ }\n[data-theme=\"jungleBiome\"]  { /* jungleBiome block */ }\n[data-theme=\"rainbowRoad\"]  { /* rainbowRoad block */ }\n[data-theme=\"lavaLevel\"]    { /* lavaLevel block */ }\n[data-theme=\"powerUp\"]      { /* powerUp block */ }\n```\n\nNumbers above are the expected shape, not a transcript — press **Solve themes** for the authoritative values and log line (`solve: converged=… iterations=… residual=… mainMenu: 0 unmet · newGame: 0 unmet · saveRoom: 0 unmet · voidRunner: 0 unmet · hardcoreMode: 0 unmet · questLog: 0 unmet · finalBoss: 0 unmet · hydroZone: 0 unmet · synthwave: 0 unmet · jungleBiome: 0 unmet · rainbowRoad: 0 unmet · lavaLevel: 0 unmet · powerUp: 0 unmet`).\n\n**Sanity check after solving.** The `--color-canvas` of `newGame` must be L ≈ 98.5%, of `questLog` L ≈ 96%, of `powerUp` L ≈ 96.5% and of `rainbowRoad` L ≈ 95% — and **not above 100%**: a canvas at L > 1 (or otherwise outside sRGB) is what the preview paints as near-black, which is how the pin failure first showed up. `saveRoom` / `voidRunner` / `hardcoreMode` / `finalBoss` / `hydroZone` / `synthwave` / `jungleBiome` / `lavaLevel` must emit canvases at L 30 / 5 / 7 / 22 / 20 / 12 / 18 / 17% with brand hues 190 / 205 / 95 / 340 / 195 / 345 / 145 / 45°, and every surface ramp must be two equal `stepL` steps. If a canvas comes back near `oklch(15% … 266)`, or above L 100%, or a ramp is uneven, the pin rules have lost their `locked` flag or their `weight 20` — see §10, *Theme mechanics*. Every `onAccent` must equal its theme's `canvas`. A second, cheaper check for the colour policy: no proposed canvas should emit C < 0.008, and no proposed `surface2` should emit a chroma far below its canvas (if it does, `gamut srgb` clipped the darkest/brightest ramp step — lower `canvasC` by 0.005 in that block).\n\n**Derived tokens expected to move more than ΔE 0.05 from their seed**\n\n* `border` (`mainMenu`) — lifted from `L 36.4%` to roughly `L 48%` by `contrast border canvas >= uiC` (finding F2): 3:1 on a canvas with Y 0.004 needs Y ≥ 0.112, i.e. a neutral at L ≈ 0.48. This is the one visible change the sketch imposes on the current design: hairlines and `--border` get noticeably brighter.\n* `textMuted` (`mainMenu`) — nudged up ≈ 0.015 L by `contrast textMuted surface2 >= mutedC` (finding F1); on the canvas it was already compliant.\n* `surface1` — +0.018 L because `stepL` is locked at the mean of the two uneven measured steps, making the nav/browse-bar one notch lighter than `#0d1117` and the ramp even.\n* every token in the twelve **proposed** themes, which have no observed values at all. Seeds were placed by hand on the right side of each canvas and *inside* every contrast floor of that canvas with ≈ 0.01–0.02 L of margin, so the solver starts with no unmet rule and nothing tugs on the pins; anything that moves more than ΔE 0.05 is a seed that contradicts a floor (most likely `border`, `success` or `warning` on the light themes, where greens and oranges carry more luminance per unit L than the blues do) or a chroma that `gamut srgb` has to pull in — expected on `synthwave` (magenta brand, acid-green `success`), `jungleBiome` (leaf-green brand at C 0.18), `rainbowRoad` and `powerUp` (C 0.21 brands), and on the cyan/teal brands of `saveRoom`, `voidRunner` and `hydroZone`, which sit right at the sRGB ceiling for their hue.\n\n**What each proposed theme is for**\n\n| theme | canvas | brand | polarity | one-line intent |\n|---|---|---|---|---|\n| `newGame` | `oklch(98.5% 0.008 250)` | `oklch(50% 0.17 252)` | light | the default `prefers-color-scheme: light` answer — a clean start screen; brand at L 50% so `link` (= brand) clears 4.5:1 on `surface2` |\n| `saveRoom` | `oklch(30% 0.03 200)` | `oklch(76% 0.14 190)` | dark | the room you stop in: calm slate-teal canvas, teal brand, blue tag chips (`a2DH` 60), green / amber badges, body text at L 89% — the long-reading theme |\n| `voidRunner` | `oklch(5% 0.012 265)` | `oklch(80% 0.14 205)` | dark | OLED black with an electric cyan brand; the measured offsets are kept so the family rotates with it (chips → periwinkle, success → lime, warning → coral); `stepL` 0.06 so the surfaces still separate |\n| `hardcoreMode` | `oklch(7% 0.002 266)` | `oklch(88% 0.18 95)` | dark | max-legibility settings preset: achromatic greys, the conventional high-contrast yellow brand, offsets re-set to lavender / green / orange, `mutedC` 7, `uiC` 4.5, text at L 98.5% |\n| `questLog` | `oklch(96% 0.028 85)` | `oklch(46% 0.14 248)` | light | parchment: warm sepia canvas with an ink-blue brand; `grayH` is moved to 70° so the whole reading family turns warm |\n| `finalBoss` | `oklch(22% 0.07 295)` | `oklch(76% 0.17 340)` | dark | arena twilight: the most chromatic canvas in the set, pink brand, periwinkle chips, teal / gold badges; the tint flows into the surfaces through `lock C/H canvas surface1 surface2` |\n| `hydroZone` | `oklch(20% 0.055 230)` | `oklch(80% 0.14 195)` | dark | the water level: deep navy with an aqua brand; chips coral (25°), success seafoam (160°), warning sand (80°) — a cool canvas with one warm complementary accent |\n| `synthwave` | `oklch(12% 0.045 310)` | `oklch(72% 0.20 345)` | dark | neon retrowave: near-black violet, magenta brand, cyan chips, acid-green and hot-yellow badges; the most saturated palette in the set, seeded at the sRGB edge so `gamut srgb` is doing real work |\n| `jungleBiome` | `oklch(18% 0.05 155)` | `oklch(82% 0.18 145)` | dark | spawn biome: deep rainforest canvas with a leaf-green brand; because the brand already owns green, `success` is pushed to teal (175°), chips are hibiscus pink (350°) and `warning` is mango (65°) |\n| `rainbowRoad` | `oklch(95% 0.03 320)` | `oklch(46% 0.21 330)` | light | the light theme with the volume up: lavender-pink canvas, magenta brand, teal chips, green / orange badges; `grayH` 320 / `grayC` 0.035 tint even the reading greys purple |\n| `lavaLevel` | `oklch(17% 0.06 330)` | `oklch(78% 0.17 45)` | dark | the molten level: plum canvas, tangerine brand, hot-pink chips, teal / gold badges — the warm-brand counterpart to `finalBoss` |\n| `powerUp` | `oklch(96.5% 0.028 165)` | `oklch(49% 0.21 355)` | light | pickup pastel: mint canvas with a raspberry brand, grape chips (the measured `accent2C` 0.165 survives at L 47%), green / tangerine badges |\n\n**Preview templates.** `preview.css` / `preview.html` exercise the nav + hero + card-ramp + browse-chip surfaces of the real site in one screenful: `canvas` behind everything, `surface1` for the sticky bar, `surface2` for the card and the nested modal body, `border` on every hairline, `text`/`textMuted`/`link` in prose, `brand`/`brandHover` on the launch button and its hover, `accent2`/`accent2Hover` on the tag chip, `success`/`warning` on the category badges, `highlight` inside `<mark>`, `onAccent` as the text of both filled controls. Use the theme selector in the Preview window to cycle all thirteen — the canvases alone should be enough to tell them apart.",

          "replacements": "Replace the literals in place; the `:root` blocks of `css/style.css` and `css/home.css` become thin aliases onto the generated tokens (see *Theme plumbing*).\n\n| literal | where | property | token | replacement |\n|---|---|---|---|---|\n| `#0d1117` | style.css `:root --bg` \u00d71 | custom prop | `surface1` | `--bg: var(--color-surface-1)` |\n| `#161b22` | style.css `:root --surface` \u00d71 | custom prop | `surface2` | `--surface: var(--color-surface-2)` |\n| `#30363d` | style.css `:root --border` \u00d71 | custom prop | `border` | `--border: var(--color-border)` |\n| `#58a6ff` | style.css `:root --accent` \u00d71 | custom prop | `brand` | `--accent: var(--color-brand)` |\n| `#bc8cff` | style.css `:root --accent2` \u00d71 | custom prop | `accent2` | `--accent2: var(--color-accent-2)` |\n| `#e6edf3` | style.css `:root --text` \u00d71 | custom prop | `text` | `--text: var(--color-text)` |\n| `#8b949e` | style.css `:root --text-muted` \u00d71 | custom prop | `textMuted` | `--text-muted: var(--color-text-muted)` |\n| `#7ee787` | home.css `:root --accent3` \u00d71 | custom prop | `success` | `--accent3: var(--color-success)` |\n| `#ffa657` | home.css `:root --accent4` \u00d71 | custom prop | `warning` | `--accent4: var(--color-warning)` |\n| `rgba(13,17,23,.9)` | style.css `nav` \u00d71 | background | `surface1` | `background: color-mix(in oklab, var(--color-surface-1) 90%, transparent)` |\n| `rgba(13,17,23,.55)` | home.css `nav` \u00d71 | background | `surface1` | `color-mix(in oklab, var(--color-surface-1) 55%, transparent)` |\n| `rgba(13,17,23,.82)` | browse.css `.browse-bar` \u00d71 | background | `surface1` | `color-mix(in oklab, var(--color-surface-1) 82%, transparent)` |\n| `rgba(22,27,34,.55)` | home.css `--surface-glass` \u00d71 | custom prop | `surface2` | `color-mix(in oklab, var(--color-surface-2) 55%, transparent)` |\n| `rgba(22,27,34,.78)` | home.css `--surface-glass-strong` \u00d71 | custom prop | `surface2` | `color-mix(in oklab, var(--color-surface-2) 78%, transparent)` |\n| `#0a0d14` | home.css `body` gradient base \u00d71 | background | `canvas` | `var(--color-canvas)` |\n| `#0a0d14` | home.css \u00d74, browse.css \u00d73 (`.btn-primary`, `.featured-card-launch`, `.modal-launch`, `.entry-open`, `.cat-tab[aria-selected]`, `.tag-chip[aria-pressed]`) | color | `onAccent` | `color: var(--color-on-accent)` |\n| `#0d1117` | style.css `.btn-primary` \u00d71 | color | `onAccent` | `color: var(--color-on-accent)` |\n| `#58a6ff` | home.css \u00d74 (brand glyph, footer mark, aurora blob 1), browse.css \u00d71 | gradient stop / background | `brand` | `var(--color-brand)` |\n| `#79b8ff` | home.css \u00d72, browse.css \u00d71 (launch gradients) | gradient stop | `brandHover` | `var(--color-brand-hover)` |\n| `#79c0ff` | browse.css `.entry-badge.is-cat-lab` \u00d71 | color | `brandHover` | `color: var(--color-brand-hover)` |\n| `#6ea8fe` | home.css `.nav-section-link::after` \u00d71 | gradient stop | `brandHover` | `var(--color-brand-hover)` |\n| `#bc8cff` | home.css \u00d73 (brand glyph, footer mark, aurora blob 2) | gradient stop / background | `accent2` | `var(--color-accent-2)` |\n| `#a78bff` | browse.css `.cat-tab[aria-selected]` \u00d71 | gradient stop | `accent2Hover` | `var(--color-accent-2-hover)` |\n| `#b78cff` | home.css \u00d72 (`.nav-section-link::after`, `.is-active`) | gradient stop / color | `accent2Hover` | `var(--color-accent-2-hover)` |\n| `#cdd6ff` | home.css `.back-to-top` \u00d71 | color | `accent2Hover` | `color: var(--color-accent-2-hover)` \u2014 or keep literal, see \u00a710 |\n| `#7ee787` | home.css `.aurora-blob-3` \u00d71 | gradient stop | `success` | `var(--color-success)` |\n| `#ffa657` | home.css `.hero-title-accent` \u00d71 | gradient stop | `warning` | `var(--color-warning)` |\n| `#ffe1a3` | browse.css `.entry-card mark` \u00d71 | color | `highlight` | `color: var(--color-highlight)` |\n| `rgba(255,212,121,.24)` | browse.css `.entry-card mark` \u00d71 | background | `highlight` | `color-mix(in oklab, var(--color-highlight) 24%, transparent)` |\n| `rgba(88,166,255,\u2026)` \u00d7~18 | home.css, browse.css | border / bg / glow | `brand` | `color-mix(in oklab, var(--color-brand) N%, transparent)` |\n| `rgba(188,140,255,\u2026)` \u00d7~10 | home.css, browse.css | border / bg / glow | `accent2` | `color-mix(in oklab, var(--color-accent-2) N%, transparent)` |\n| `rgba(126,231,135,.3)` | browse.css \u00d71 | border | `success` | `color-mix(in oklab, var(--color-success) 30%, transparent)` |\n| `rgba(255,166,87,.3)` | browse.css \u00d71 | border | `warning` | `color-mix(in oklab, var(--color-warning) 30%, transparent)` |\n| `rgba(121,192,255,.3)` | browse.css \u00d71 | border | `brandHover` | `color-mix(in oklab, var(--color-brand-hover) 30%, transparent)` |\n| `#fff` | browse.css `.btn`-like fill \u00d71, videos.css \u00d71 | color | \u2014 | keep literal |\n| `#05050c` | videos.css \u00d73 | background | \u2014 | keep literal (video letterbox) |\n| `rgba(0,0,0,\u2026)` \u00d7~14 | home.css, browse.css | box-shadow / scrim | \u2014 | keep literal (shadows) |\n| `rgba(255,255,255,\u2026)` \u00d7~40 | all files | hairline borders, chip fills | \u2014 | keep literal (neutral overlays) |\n\n**Deletions.** There are no per-theme override blocks today (the site is dark-only), so nothing is deleted at this step. Once the light theme ships, delete any ad-hoc lightening that the tokens now handle \u2014 in particular the hard-coded `#0a0d14` foregrounds listed above must *all* become `var(--color-on-accent)`, or the light theme will paint near-black text on a near-white button.",

          "plumbing": "The stylesheets have **no** theme mechanism today: everything lives in `:root` of `css/style.css` (with `css/home.css` adding more root variables). Adopt the emitted blocks as follows.\n\n1. Load the generated file **first**, before every other stylesheet:\n   ```html\n   <link rel=\"stylesheet\" href=\"css/mathematical-explorations-tokens.css\" />\n   <link rel=\"stylesheet\" href=\"css/style.css\" />\n   <link rel=\"stylesheet\" href=\"css/home.css\" />   <!-- or browse.css / videos.css -->\n   ```\n2. Keep the legacy variable names as aliases in `css/style.css` so no selector has to change on day one:\n   ```css\n   :root {\n     color-scheme: dark light;   /* NEW \u2014 form controls + scrollbars follow the theme */\n     --bg:          var(--color-surface-1);\n     --surface:     var(--color-surface-2);\n     --border:      var(--color-border);\n     --accent:      var(--color-brand);\n     --accent2:     var(--color-accent-2);\n     --text:        var(--color-text);\n     --text-muted:  var(--color-text-muted);\n     /* home.css */\n     --accent3:     var(--color-success);\n     --accent4:     var(--color-warning);\n     --accent-glow:  color-mix(in oklab, var(--color-brand) 45%, transparent);\n     --accent2-glow: color-mix(in oklab, var(--color-accent-2) 35%, transparent);\n     --border-glow:  color-mix(in oklab, var(--color-brand) 25%, transparent);\n     --surface-glass:        color-mix(in oklab, var(--color-surface-2) 55%, transparent);\n     --surface-glass-strong: color-mix(in oklab, var(--color-surface-2) 78%, transparent);\n   }\n   ```\n3. `switchMode` is `media,attribute`: the emitter writes `:root` (`mainMenu`, the default), `@media (prefers-color-scheme: light) { :root { \u2026 } }` (`newGame`) and one `[data-theme=\"\u2026\"]` block per theme. Only `newGame` is reachable through the media query \u2014 the OS knows two schemes; `saveRoom`, `voidRunner`, `hardcoreMode`, `questLog`, `finalBoss`, `hydroZone`, `synthwave`, `jungleBiome`, `rainbowRoad`, `lavaLevel` and `powerUp` are **attribute-only**. Because the site is dark-first, set `defaultTheme: mainMenu` (already configured) so a visitor with no preference keeps today's look.\n4. For an explicit switcher, set `document.documentElement.dataset.theme` to one of `mainMenu | newGame | saveRoom | voidRunner | hardcoreMode | questLog | finalBoss | hydroZone | synthwave | jungleBiome | rainbowRoad | lavaLevel | powerUp` \u2014 the attribute blocks are emitted last and win over the media query. Persist the choice in `localStorage`; on load, apply it before the first paint (inline `<script>` in `<head>`) to avoid a flash of the wrong theme. `hardcoreMode` is also a sensible automatic answer to `@media (prefers-contrast: more)` \u2014 add that mapping in the switcher script, not in CSS, so the user's explicit pick still wins. With thirteen entries the switcher should be a `<select>` (or a grouped menu the way a game groups presets: *Default* \u2014 mainMenu, newGame \u00b7 *Low light* \u2014 saveRoom, voidRunner, questLog \u00b7 *Loud* \u2014 synthwave, finalBoss, hydroZone, jungleBiome, lavaLevel, rainbowRoad, powerUp \u00b7 *Accessibility* \u2014 hardcoreMode) rather than a row of toggle buttons. Label each option with its display name (\u201cSynthwave\u201d, \u201cSave Room\u201d, \u201cHydro Zone\u201d, \u201cRainbow Road\u201d, \u201cPower-Up\u201d, \u201cHardcore Mode\u201d\u2026) and keep the attribute value in camelCase.\n5. `color-scheme` should follow the polarity of the active theme: emit `color-scheme: light` inside the `newGame`, `questLog`, `rainbowRoad` and `powerUp` attribute blocks and `color-scheme: dark` inside the others, otherwise native scrollbars and form controls stay dark on a parchment canvas.\n6. `body`'s two radial gradients in `css/home.css` (`#0f1626`, `#181024`) are decorative atmosphere, not tokens; when a light theme lands, wrap them in the attribute selector or rebuild them with `color-mix(in oklab, var(--color-brand) 12%, var(--color-canvas))` \u2014 that expression is polarity-agnostic, works for all thirteen themes, and on the loud themes it is what makes the background glow the right colour instead of staying navy.",

          "alpha": "The design leans heavily on translucency; three mechanisms cover every case.\n\n**1. Token tints \u2192 `color-mix`.** Any `rgba()` whose RGB triple matches a token becomes a mix with `transparent` at the same percentage:\n\n```css\n/* before */ border: 1px solid rgba(88, 166, 255, 0.25);\n/* after  */ border: 1px solid color-mix(in oklab, var(--color-brand) 25%, transparent);\n\n/* before */ background: rgba(188, 140, 255, 0.06);\n/* after  */ background: color-mix(in oklab, var(--color-accent-2) 6%, transparent);\n```\n\nThis applies to all `--accent-glow` / `--accent2-glow` / `--border-glow` definitions, the badge borders in `browse.css`, the tag chips, and the sticky-bar backgrounds.\n\n**2. Shade variants that were not promoted to tokens \u2192 relative colour syntax.** The one-off hover lightenings can be derived instead of hard-coded:\n\n```css\n.entry-open:hover { background: oklch(from var(--color-brand) calc(l + 0.04) c h); }\n.tag-chip:hover  { border-color: oklch(from var(--color-accent-2) l calc(c * 0.8) h); }\n```\n\nUse this only where the value is *not* in the token map \u2014 `brandHover` and `accent2Hover` already exist and must be used directly.\n\n**3. Keep literal.** Neutral scrims and shadows stay as written: `rgba(0,0,0,\u2026)` in every `box-shadow`, `rgba(255,255,255,0.02\u20130.16)` hairlines and chip fills, `rgba(5,7,11,0.78)` modal scrim, `#05050c` video letterbox. They are luminance effects, not palette colours; mixing them with the canvas token would make glass panels muddy in the light theme. Revisit only the modal scrim, which should become `color-mix(in oklab, var(--color-canvas) 78%, transparent)` when the light theme ships.",

          "skip": "Not tokenised, deliberately:\n\n* `currentColor` (`.cat-tab .cat-count`, `.entry-badge` inheritance) \u2014 already relative.\n* `transparent` (~30 occurrences: gradient tails, mask stops, `.btn-secondary`, `.tag-more`) \u2014 not a colour.\n* `black` inside `mask-image` / `-webkit-mask-image` in `css/home.css` \u2014 a mask stop, ignored by the palette.\n* All `rgba(255,255,255,\u2026)` hairlines, chip fills and the skeleton sweep gradient \u2014 neutral light overlays; they read correctly against any dark surface and are re-evaluated (not re-coloured) when the light theme lands.\n* All `rgba(0,0,0,\u2026)` shadows and input wells \u2014 depth cues.\n* `#05050c` (videos.css, \u00d73) \u2014 the `<video>` element's own letterbox; intentionally darker than `canvas`.\n* `#fff` on `.featured-card-play:focus-visible` and `.back-to-top:hover` \u2014 a deliberate maximum-contrast highlight.\n* `rgba(150,160,255,\u2026)` / `rgba(180,190,255,\u2026)` / `rgba(120,130,255,\u2026)` in `css/videos.css` \u2014 a cool blue-violet halfway between `brand` and `accent2`, used only on the media frame. Tokenising it would need a 14th hue with no other consumer; left literal and noted in \u00a710.\n* `#0f1626` and `#181024` (`body` background gradient, `css/home.css`) \u2014 atmosphere stops, see *Theme plumbing* step 5.",

          "order": "Work in this order; after each step the page must look identical (the solved `mainMenu` theme reproduces the observed literals except for the F1 / F2 lifts \u2014 diff the emitted `:root` block against `css/style.css` to verify).\n\n1. **Ship the token file.** Add `mathematical-explorations-tokens.css` and load it before `style.css` on every page (`index.html`, `browse.html`, each experiment page). Nothing changes visually \u2014 nothing consumes the tokens yet.\n2. **Alias the legacy variables.** Rewrite the `:root` blocks of `style.css` and `home.css` per *Theme plumbing* step 2. All four stylesheets now render from the solved palette; diff screenshots here.\n3. **Replace the remaining literals.** Work file by file in the order of the replacement table \u2014 gradient stops in `home.css`, badge colours in `browse.css`, the `#0a0d14` foregrounds everywhere. This is the bulk of the change and is purely mechanical.\n4. **Convert the tints.** Turn every `rgba()` of a token colour into `color-mix(in oklab, \u2026)` (\u00a77 item 1). Leave shadows and white hairlines alone.\n5. **Add `color-scheme: dark light`** to `:root` so native controls, scrollbars and form widgets follow; add the per-theme `color-scheme` overrides from *Theme plumbing* step 5.\n6. **States.** Point every `:hover` / `:focus-visible` / `[aria-selected]` / `[aria-pressed]` rule at `brandHover` / `accent2Hover` instead of its literal, or at relative colour syntax (\u00a77 item 2). Do this before enabling any light theme: `hoverStep` is negative there, so a literal lightening would move the wrong way.\n7. **Fix the findings.** Accept the solver's brighter `border` (F2) and the muted-text lift (F1); re-check `.hero-hint` and `.tag-row-label` opacity (F3).\n8. **Enable `newGame`.** Un-mark `theme newGame` as proposed, re-solve, review the emitted block, then handle the two `body` gradient stops and the modal scrim. It is the only proposed theme the OS can select on its own, so it ships first.\n9. **Rebuild the atmosphere, then enable the dark themes.** `saveRoom`, `voidRunner`, `finalBoss`, `hydroZone`, `jungleBiome` and `lavaLevel` share polarity with the shipped design and need no template work \u2014 but the aurora blobs were tuned against `#0a0d14` and every one of these canvases is tinted, so rebuild the blobs from `var(--color-brand)` / `var(--color-accent-2)` / `var(--color-success)` *first*, then wire the themes into the switcher. On `voidRunner` the blobs will look brighter; on `finalBoss` / `lavaLevel` an un-rebuilt blue blob vanishes into the plum canvas; on `jungleBiome` / `hydroZone` it clashes outright.\n10. **Enable `hardcoreMode`.** Review every `color-mix(\u2026, transparent)` tint: at `uiC` 4.5 the translucent chip fills and glass surfaces are the weakest link, and may need an opaque fallback under `[data-theme=\"hardcoreMode\"]`.\n11. **Enable `questLog`, `rainbowRoad` and `powerUp`.** Same review as `newGame` plus the tinted greys: check that the `<mark>` foreground (hue 78\u201383\u00b0, close to `questLog`'s canvas hue) still reads as a highlight and not as a stain, and that `rainbowRoad`'s purple-tinted `textMuted` is not mistaken for a link.\n12. **Enable `synthwave`.** Last, because its seeds sit hardest against the sRGB edge: compare the emitted `--color-brand` / `--color-success` against the seeds and, if `gamut srgb` has pulled the chroma down, either accept the slightly calmer neon or lower `brandC` in the block so the solver is not fighting the gamut. Do the same spot-check on `jungleBiome`, `rainbowRoad` and `powerUp`.\n13. **Remove the fallbacks.** Once the token file ships unconditionally, drop the `var(--color-x, <old literal>)` second arguments from the preview and from any code that adopted them.",

          "findings": "**Naming**\n\n* **The thirteen theme ids are the switch values and the picker labels.** They are written in the lexicon of the audience: `mainMenu` (today's design — the screen you land on), `newGame`, `saveRoom`, `voidRunner`, `hardcoreMode`, `questLog`, `finalBoss`, `hydroZone`, `synthwave`, `jungleBiome`, `rainbowRoad`, `lavaLevel`, `powerUp`. Nothing in the colour model depends on a name; renaming a block renames the `[data-theme=\"…\"]` selector and nothing else. Two names carry a promise the palette must keep: `hardcoreMode` is the accessibility preset (raised floors, achromatic greys) and `mainMenu` is the found theme (it must keep reproducing the shipped CSS), so do not re-tune either for looks.\n\n**Theme mechanics**\n\n* **Inputs are pinned by `locked` variables *and* weighted pin rules — not anchored, not free, and not weight-1.** Three earlier revisions produced near-identical symptoms (the light themes rendering with a near-black canvas, the dark themes indistinguishable) for three different reasons. (1) The inputs were `anchor` points restated inside each `theme` block; an anchor's position is a fixed literal that a theme block cannot re-anchor, so every theme solved on `#0a0d14`. (2) The inputs were then made `derived` points held by `L/C/H … = var` pins — but the pin variables were left *unlocked*. An unlocked pin is an equation between two solver unknowns: `L canvas = canvasL` is satisfied just as well by dragging `canvasL` to wherever `canvas` drifts as by holding the canvas, so every theme relaxed back onto the `mainMenu` seeds. (3) The variables were locked but the pin rules kept the default weight 1. A pin residual is measured in L units (a 0.04 miss costs 0.0016); a contrast residual is measured in ratio units (a 0.5 miss costs 0.25), so Gauss-Newton met the light-theme floors by brightening the *canvas* rather than darkening the accents: `newGame` solved to L 102.2% and `questLog` to 98.6%, both outside sRGB, and the preview painted those swatches near-black. The same weakness stretched `newGame`'s ramp to two 6.9-pt steps, drifted `mainMenu`'s canvas chroma from 0.0131 to 0.0150 and let `onAccent` come unstuck from `canvas`. Every pin rule (`L/C/H canvas`, `L/C/H brand`, `L/C/H coolGray`, `L text = textL`) now carries `weight 20`, the ramp `dL` rules `weight 5` and the `onAccent` locks `weight 10`; in addition every proposed theme's seeds sit inside its own floors, so there is no pressure on the pins to begin with. Consequences: each theme's canvas is a hard fact, the `distance canvas … -> min` pulls stay removed, and the surface hue/chroma locks follow `canvas`, so a tinted canvas (`finalBoss` at C 0.07, `lavaLevel` 0.06, `hydroZone` 0.055, `jungleBiome` 0.05, `synthwave` 0.045, `questLog` at hue 85°, `rainbowRoad` lavender, `powerUp` mint) carries its tint into the ramp. If a future edit makes a theme collapse onto the `mainMenu` canvas again, or emit an L above 100%, check the `locked` flags and the `weight`s first.\n* **Loudness is a policy, not an accident.** Every proposed canvas is tinted (C 0.028–0.07 dark, 0.008–0.03 light), every `grayC` is raised to 0.02–0.035 so even the reading greys carry the theme, and every brand sits near the sRGB chroma ceiling for its hue. Because `lock C/H canvas surface1 surface2` ties the ramp to the canvas, raising `canvasC` colours the nav, the cards and the modal in one move — that single variable is the main dial if a theme is judged too loud or too grey. Two deliberate exceptions: `mainMenu` (found, untouched) and `hardcoreMode` (`canvasC` 0.002, `grayC` 0.004 — legibility beats colour; its loudness lives in the yellow brand at C 0.18).\n* **Diversity comes from `brandH`, the canvas, and three offset variables.** The brands sit around the wheel — `saveRoom` teal 190°, `voidRunner` cyan 205°, `hardcoreMode` yellow 95°, `finalBoss` pink 340°, `hydroZone` aqua 195°, `synthwave` magenta 345°, `jungleBiome` green 145°, `lavaLevel` tangerine 45°, with `newGame` 252°, `questLog` 248°, `rainbowRoad` 330° and `powerUp` 355° on the light side — and the dark canvases differ in lightness (5 / 7 / 12 / 17 / 18 / 20 / 22 / 30%), tint and ramp width (`stepL` 0.03–0.06). `accent2`, `success`, `warning` and `highlight` remain hue *offsets* from `brand`, but the offsets are per-theme `locked` variables (`a2DH`, `successDH`, `warningDH`, measured +52° / −103° / +166°): `voidRunner` leaves them alone so the whole family rotates with the brand (periwinkle / lime / coral); every other proposed theme re-aims them so `success` stays green-to-teal and `warning` stays amber-to-gold when the brand leaves the blue quadrant. Two themes need a special case: `jungleBiome`'s brand *is* green, so its `success` is pushed 30° towards teal to stay distinguishable from links, and `synthwave`'s `success` is deliberately acid green (135°) to match the genre.\n\n**Accessibility**\n\n* **F1 — `textMuted` on `surface2` measures 4.2:1**, below the 4.5:1 AA floor for normal text. This pair occurs constantly: `.card p`, `.controls label`, `.modal-body`, `.entry-sub`, `.entry-pitch`, `.readme-preview`, `footer p`. The floor is written; the solver lifts `textMuted` by ≈ 0.015 L, which also nudges it on the canvas (6.0:1 → 6.3:1).\n* **F2 — `border` on `canvas` measures 2.0:1**, below the 3:1 non-text floor. `--border` is the hairline of every card, nav, control panel and footer divider. The floor is written and the solver lifts `border` from `L 36.4%` to ≈ `L 48%` (3:1 on a canvas with Y 0.004 needs Y ≥ 0.112). This is the one deliberate visual change the sketch imposes; if the softer hairline is preferred, set `var uiC = 1.8` in `theme mainMenu` and record the exception — the other themes keep the real floor.\n* **F3 — opacity-dimmed text.** `.hero-hint` (opacity 0.7), `.tag-row-label` (0.7), `.empty-glyph` (0.35) and `.hero-scroll` (0.5) reduce an already-muted colour further; the effective ratios fall to ≈ 4.0:1, 4.0:1 and below. Opacity is outside the palette model, so no constraint is written — either raise the opacity to 1 and rely on `textMuted`, or introduce a `textFaint` token with its own 4.5:1 floor.\n* **F4 — hairlines on light canvases are dark.** `uiC` = 3 against a canvas at L 95–98.5% forces `border` down to L ≈ 62–63%, far darker than the pale `#d0d7de`-style rule most light UIs use. The `newGame`, `questLog`, `rainbowRoad` and `powerUp` seeds are placed there deliberately so the solver does not have to drag them. If softer hairlines are wanted, lower `uiC` in those theme blocks and record the exception; do not weaken the shared rule.\n* **F5 — colour-only badge identity on the recoloured themes.** On `mainMenu` the game badge is green and the essay badge orange; on `finalBoss` / `lavaLevel` they are teal and gold, on `hydroZone` seafoam and sand, on `synthwave` acid green and hot yellow, on `jungleBiome` teal and mango. The hue *relationship* (cool = game, warm = essay) is preserved everywhere, but the absolute colours are not, so the `.entry-badge` label text must stay visible — never reduce the badge to a coloured dot alone. This matters more now than in the previous revision: the loud themes make the badges the most eye-catching thing on a card.\n* **F6 — saturation is not a substitute for contrast, and vice versa.** Every floor in the sketch is applied unchanged to the loud themes, so `synthwave`'s neon and `rainbowRoad`'s magenta are legibility-checked like everything else. What the model does *not* cover is fatigue: offer `saveRoom`, `questLog` or `hardcoreMode` prominently in the picker, and never make a loud theme the default.\n\n**Clustering decisions**\n\n* **C9** merges `#79b8ff`, `#79c0ff` and `#6ea8fe` (pairwise ΔE_ok ≤ 0.019). They are three hand-tuned spellings of “lighter brand”; one `brandHover` token replaces all three. The largest single shift is `#6ea8fe` → solved value, ≈ ΔE 0.014.\n* **C10** merges `#a78bff`, `#b78cff` and `#cdd6ff` **aggressively**: the first two are ΔE 0.011 apart, but `#cdd6ff` (the `.back-to-top` glyph) is ΔE 0.13 away — far lighter and far less saturated. It was folded in because it is a single decorative occurrence with no other home. If the back-to-top button should keep its pale tint, leave that one literal or add a `textOnOverlay` token.\n* **`link` is currently identical to `brand`.** The sketch keeps them as separate points joined by `lock H` / `lock C` and `distance link brand -> min`, so the solver collapses them in `mainMenu` (expected) while light themes are free to darken the link for its 4.5:1 floors. `newGame`, `questLog`, `rainbowRoad` and `powerUp` pin `brandL` at 0.50 / 0.46 / 0.46 / 0.49 so the collapse holds there too. The collapse is acceptable, not a bug.\n\n**Near-neutral hues**\n\n* `text` (C 0.0096), `border` (C 0.0118) and the two surfaces (C 0.0128) are all below or near the C < 0.02 reliability threshold, so their measured hues (238.7°–265.8°, a 27° spread) are numerically meaningless. Hue is taken from the `coolGray` pin (`grayH`, 255°) for the reading family and from `canvas` for the surfaces — not from the greys themselves. Expect the emitted greys to read very slightly bluer than `#e6edf3` and very slightly warmer than `#30363d`. The same mechanism is what lets `questLog` turn the whole reading family warm by setting `grayH` alone, `rainbowRoad` turn it purple (`grayH` 320, `grayC` 0.035) and `jungleBiome` / `hydroZone` / `lavaLevel` tint it towards their canvas, and what lets `hardcoreMode` go fully neutral by setting `canvasC` / `grayC` near zero (not to zero: the hue locks need a defined hue).\n\n**Proposed, not found**\n\n* **Twelve of the thirteen themes are entirely proposed.** No `prefers-color-scheme`, `[data-theme]` or `.dark` selector exists anywhere in the four stylesheets; `newGame`, `saveRoom`, `voidRunner`, `hardcoreMode`, `questLog`, `finalBoss`, `hydroZone`, `synthwave`, `jungleBiome`, `rainbowRoad`, `lavaLevel` and `powerUp` contain variable overrides and *seeds* only, and every value they emit is solver output. Review each before shipping — in particular the glass surfaces and the aurora blobs, which were designed for `#0a0d14` and will need their own treatment on every other canvas.\n* **`accent2C` is per-theme, no longer `shared`.** A blue- or cyan-leaning `accent2` at L 74–80% leaves sRGB above C ≈ 0.13–0.16, and a shared variable would have let `gamut srgb` dull the chip colour in every theme for the sake of one. `saveRoom` sets 0.13 (blue), `voidRunner` 0.14 (periwinkle), `finalBoss` 0.15, `hardcoreMode` 0.10 (lavender at L 80%), `hydroZone` 0.14 (coral), `synthwave` 0.14 (cyan), `jungleBiome` 0.16 (hibiscus), `lavaLevel` 0.16 (hot pink), `rainbowRoad` 0.14 (teal at L 46%); `mainMenu`, `newGame`, `questLog` and `powerUp` keep the measured 0.165 (violet / grape is the one hue that holds it at both polarities). `gamut srgb` stays on as a backstop.\n* **`synthwave` is seeded at the sRGB edge on purpose.** A neon brand at L 72% / C 0.20 / 345° and an acid-green `success` at L 85% / C 0.19 are about as saturated as sRGB allows; if the emitted chroma comes back lower than the seed, that is `gamut srgb` doing its job, not a pin failure. The same is true of `jungleBiome`'s C 0.18 leaf green, the C 0.21 brands of `rainbowRoad` and `powerUp`, and the cyan/teal brands of `saveRoom`, `voidRunner` and `hydroZone` (cyan runs out of chroma earlier than magenta does). Lower `brandC` in the block if the residual is unwelcome.\n* **`voidRunner`'s hairline is bright.** 3:1 against a near-black canvas needs Y ≥ 0.10, i.e. `border` at L ≈ 47% — the same level the F2 lift reaches on `mainMenu`. `synthwave` (canvas L 12%) has the same property. It is correct, but check that the card outlines do not become the loudest element on the page.\n* **`hardcoreMode`'s brand is yellow.** 95° at L 88% is the conventional high-contrast accent and is unmistakable next to the blue `mainMenu`; the offsets are re-set so chips are lavender, `success` green and `warning` orange. If the site's blue identity must survive the toggle, set `brandH` back to 250 and the offsets back to their defaults in that block.\n* **`finalBoss`'s family is re-coloured.** With `brandH` 340° the brand is pink, `accent2` periwinkle (280°), `success` teal (172°) and `warning` gold (82°) rather than blue / violet / green / orange. That is the intent — an arena-twilight palette — but confirm the category badges are still identifiable by shape/label, not colour alone (F5).\n* **`hydroZone`, `jungleBiome`, `lavaLevel`, `finalBoss` and `synthwave` put a strongly chromatic canvas under the glass.** At canvas C 0.045–0.07 the `--surface-glass` mixes (55–78 % of `surface2` over the canvas) stay on-hue because the ramp is locked to the canvas chroma, but the `rgba(255,255,255,…)` hairlines will read noticeably tinted by simultaneous contrast, and the `rgba(0,0,0,…)` shadows will read muddier than on `mainMenu`. Acceptable; noted so it is not mistaken for a token leak. If a glass panel looks dirty, replace the white hairline with `color-mix(in oklab, var(--color-text) 12%, transparent)` under that theme.\n* **`rainbowRoad` and `powerUp` tint the light canvas to its ceiling.** A light canvas can only carry C ≈ 0.03 before a corner of the ramp leaves sRGB, so both are seeded there; they are pastel rather than saturated by construction — the loudness lives in the C 0.21 brand, not in the background. If the emitted `surface2` comes back at lower chroma than the canvas, `gamut srgb` has clipped the darkest step — lower `canvasC` by 0.005 in the block.\n\n**Rules softened rather than omitted**\n\n* `success` and `warning` are now joined by `lock L success warning weight 0.1`. The observed 6-point gap (85.4% vs 79.1%) has no pattern and the weight is too low to close it; the tie exists so that hand-placed seeds in the proposed themes cannot leave one badge conspicuously heavier than the other.\n\n**Rules deliberately not written**\n\n* No `contrast border surface2` floor: a hairline between a card and the canvas is judged against the canvas; requiring 3:1 against `surface2` as well would push `border` past L 55% on `mainMenu`.\n* No `distance canvas textMuted/border -> min`: the greys are seeded at their floors in every theme and the contrast rules lift them where a seed falls short; a pull toward the pinned canvas would only add residual the solver cannot resolve.\n* No minimum-chroma rule (`C canvas >= …`). Loudness is enforced by the theme blocks' own pinned `canvasC` / `brandC`, not by a shared floor — a floor would fight `hardcoreMode`, whose achromatic greys are the point.\n* No token for the `rgba(150,160,255,…)` family in `css/videos.css` — see *Do not tokenise*.\n* The two `body` gradient stops `#0f1626` / `#181024` are not points: they are blurred atmosphere at 60 % falloff, and constraining them would over-determine the canvas.\n* Gamut: every input and every observed literal is inside sRGB; `gamut srgb` adds no active constraint on `mainMenu` today, but stays on so the proposed themes cannot drift out — and on `synthwave`, `jungleBiome`, `rainbowRoad` and `powerUp` it is expected to be active (see above).",

transparent); }\n",
            "html": "<div class=\"bar\"><b>\u2211 Explorations</b><span class=\"muted\">sticky nav on surface1</span></div>\n<h2>Mathematical Explorations</h2>\n<p>Body text on <code>canvas</code>. <span class=\"muted\">Secondary copy uses <code>textMuted</code>.</span> A <a href=\"#\">link</a> shares the brand hue, and search results <mark>highlight</mark> inline.</p>\n<div class=\"card\">\n  <b>surface2</b> \u2014 card, modal and panel background.\n  <div class=\"card\"><b>surface1</b> \u2014 nested well; the ramp is an even lightness step.</div>\n  <p class=\"muted\" style=\"margin:8px 0 0\">Muted text on surface2 \u2014 the pair that currently fails AA (finding F1).</p>\n</div>\n<p><span class=\"btn\">Launch \u2192</span> &nbsp; <span class=\"chip\">tag</span> &nbsp; <span class=\"badge ok\">game</span> <span class=\"badge warn\">essay</span></p>\n<p class=\"muted\">Every colour above is a solved point in OKLab \u2014 edit a theme variable or a rule in the Script window and re-solve.</p>\n"
