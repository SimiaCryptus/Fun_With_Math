<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Crush</title>
    <style>
      :root {
        --bg: #1a1d26;
        --panel: #242835;
        --tile: #3a4054;
        --tile-selected: #ffb454;
        --text: #f0f2f8;
        --accent: #59c2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        user-select: none;
        -webkit-user-select: none;
      }

      header {
        text-align: center;
        padding: 16px;
      }

      header h1 {
        margin: 0 0 4px;
        font-size: 1.6rem;
        letter-spacing: 0.04em;
      }

      #rule-desc {
        color: var(--accent);
        font-size: 0.95rem;
      }

      #hud {
        display: flex;
        gap: 24px;
        margin: 8px 0 16px;
        font-size: 1.05rem;
      }

      #hud .label {
        opacity: 0.6;
        margin-right: 4px;
      }

      #board-wrap {
        background: var(--panel);
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }

      canvas {
        display: block;
        touch-action: none;
      }

      #indicator {
        margin-top: 12px;
        min-height: 1.4rem;
        font-size: 1.1rem;
        text-align: center;
      }

      #indicator.valid {
        color: #7fd88f;
      }

      #indicator.invalid {
        color: #ff8080;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Number Crush</h1>
      <div id="rule-desc">&nbsp;</div>
    </header>
    <div id="hud">
      <div><span class="label">Score</span><span id="score">0</span></div>
    </div>
    <div id="board-wrap">
      <canvas id="board" width="560" height="560"></canvas>
    </div>
    <div id="indicator">&nbsp;</div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
