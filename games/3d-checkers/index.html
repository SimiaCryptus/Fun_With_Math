<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Checkers</title>
  <link rel="stylesheet" href="styles/main.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <aside id="side-panel">
      <header>
        <h1>3D Checkers</h1>
        <span id="turn-indicator"></span>
      </header>

      <section class="card" id="card-red">
        <input class="name" data-key="redName" value="Red">
        <div class="stats">
          <span class="men"></span><span class="kings"></span><span class="captured"></span>
          <span class="thinking">thinking… <em class="depth"></em></span>
        </div>
      </section>
      <section class="card" id="card-black">
        <input class="name" data-key="blackName" value="Black">
        <div class="stats">
          <span class="men"></span><span class="kings"></span><span class="captured"></span>
          <span class="thinking">thinking… <em class="depth"></em></span>
        </div>
      </section>

      <ol id="move-list"></ol>
      <button id="btn-live" class="hidden">Back to live position</button>

      <div class="buttons">
        <button id="btn-undo" title="U">Undo</button>
        <button id="btn-draw">Offer draw</button>
        <button id="btn-resign">Resign</button>
        <button id="btn-menu" title="Esc">Menu</button>
      </div>
    </aside>

    <div class="hint">
       drag: orbit · wheel: zoom · E explode · X x-ray · [ ] level · F flip · T theme · 1–5 cameras
    </div>

    <div id="view-controls">
      <label>Explode <input type="range" id="explode" min="0" max="1" step="0.01" value="1"></label>
      <div class="seg" id="view-modes">
        <button data-mode="compact">Compact</button>
        <button data-mode="exploded">Exploded</button>
        <button data-mode="slice">Slice</button>
        <button data-mode="xray">X-ray</button>
      </div>
      <label>Level
        <select id="level">
          <option value="-1">All</option>
          <option value="0">1</option><option value="1">2</option><option value="2">3</option>
          <option value="3">4</option><option value="4">5</option><option value="5">6</option>
          <option value="6">7</option><option value="7">8</option>
        </select>
      </label>
      <div class="seg" id="camera-presets">
        <button data-preset="red">Red</button>
        <button data-preset="black">Black</button>
        <button data-preset="top">Top</button>
        <button data-preset="iso">Iso</button>
        <button data-preset="side">Side</button>
      </div>
       <button id="btn-style" title="Colours, transparency, lighting &amp; themes (T cycles themes)">Style…</button>
    </div>

    <div id="toast"></div>

    <div id="menu" class="modal">
      <form id="menu-form" class="dialog">
        <h2>New game</h2>
        <div class="row">
          <span>Mode</span>
          <span>
            <label><input type="radio" name="mode" value="cpu"> vs CPU</label>
            <label><input type="radio" name="mode" value="h2h"> Head-to-head</label>
          </span>
        </div>
        <div class="row cpu-only">
          <span>Your side</span>
          <select name="humanSide"><option value="0">Red (moves first)</option><option value="1">Black</option></select>
        </div>
        <div class="row cpu-only">
          <span>Difficulty</span>
          <select name="difficulty">
            <option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option>
          </select>
        </div>
        <div class="row">
          <span>Setup</span>
          <select name="setup">
            <option value="standard">Standard — 96 v 96 (3 ranks)</option>
            <option value="light">Light — 64 v 64 (2 ranks)</option>
            <option value="skirmish">Skirmish — 32 v 32 (1 rank)</option>
          </select>
        </div>
        <div class="row">
          <span>Board</span>
          <select name="size">
            <option value="4">4×4</option>
            <option value="6">6×6</option>
            <option value="8" selected>8×8</option>
            <option value="10">10×10</option>
            <option value="12">12×12</option>
          </select>
        </div>
        <div class="row">
          <span>Levels</span>
          <select name="levels">
            <option value="1">1 (classic 2D)</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8" selected>8 (full cube)</option>
          </select>
        </div>
        <fieldset>
          <legend>Rules &amp; options</legend>
          <label><input type="checkbox" name="forcedCapture"> Forced capture</label><br>
          <label><input type="checkbox" name="menSideways"> Men may step sideways (variant)</label><br>
          <label><input type="checkbox" name="flipBoard"> Flip camera between turns (head-to-head)</label><br>
          <label><input type="checkbox" name="xrayAuto"> X-ray on selection</label><br>
          <label>Draw after <input type="number" name="drawMoves" min="10" max="200" style="width:64px"> quiet moves</label>
        </fieldset>
        <div class="row">
          <span>Names</span>
          <span><input type="text" name="redName" size="8"> <input type="text" name="blackName" size="8"></span>
        </div>
        <div class="actions">
          <button type="button" id="menu-cancel">Cancel</button>
          <button type="submit" class="primary">Start</button>
        </div>
      </form>
    </div>
     <div id="style" class="modal hidden">
       <form id="style-form" class="dialog style-dialog">
         <h2>Appearance</h2>
         <div class="row">
           <span>Theme</span>
           <select name="theme"></select>
         </div>
         <!-- Fieldsets of colour / range / checkbox controls are generated from STYLE_FIELDS -->
         <div id="style-groups"></div>
         <div class="actions">
           <button type="button" id="style-reset">Reset to theme</button>
           <button type="button" id="style-close" class="primary">Done</button>
         </div>
       </form>
     </div>


    <div id="gameover" class="modal hidden">
      <div class="dialog">
        <h2 id="gameover-title"></h2>
        <p id="gameover-text"></p>
        <div class="actions">
          <button id="gameover-close">Review board</button>
          <button id="gameover-new" class="primary">New game</button>
        </div>
      </div>
    </div>

    <div id="confirm" class="modal hidden">
      <div class="dialog">
        <p id="confirm-text"></p>
        <div class="actions">
          <button id="confirm-cancel">Cancel</button>
          <button id="confirm-ok" class="primary">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
