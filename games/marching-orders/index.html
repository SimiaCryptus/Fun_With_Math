<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marching Orders</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #151a22; font-family: system-ui, sans-serif; color: #e8ecf1; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    .panel { position: absolute; background: rgba(12, 16, 24, 0.84); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    #hud-top { top: 12px; left: 12px; min-width: 230px; }
    #hud-top h1 { margin: 0 0 6px; font-size: 16px; letter-spacing: 0.5px; }
    #hud-top .stat { display: flex; justify-content: space-between; gap: 12px; line-height: 1.5; }
    #hud-controls { top: 12px; right: 12px; display: flex; gap: 6px; }
    #hud-palette { bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; }
     .tool { display: flex; flex-direction: column; align-items: center; min-width: 78px; padding: 6px 8px; border-radius: 6px; border: 2px solid transparent; background: rgba(255, 255, 255, 0.06); cursor: pointer; color: inherit; font: inherit; font-size: 13px; }
    .tool .swatch { width: 22px; height: 22px; border-radius: 4px; margin-bottom: 4px; }
    .tool .count { font-size: 12px; opacity: 0.75; }
    .tool.active { border-color: #ffd75a; background: rgba(255, 215, 90, 0.15); }
    .tool:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn { padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.06); color: inherit; font: inherit; cursor: pointer; }
    .btn.active { border-color: #ffd75a; }
    #hud-hint { bottom: 96px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: 0.9; white-space: nowrap; }
    #hud-toast { top: 70px; left: 50%; transform: translateX(-50%); max-width: 60vw; text-align: center; }
    #hud-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); }
    #hud-overlay .card { background: #1c2431; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; padding: 24px 32px; text-align: center; }
    #hud-overlay h2 { margin: 0 0 8px; font-size: 28px; }
    #hud-overlay p { margin: 0 0 16px; opacity: 0.85; }
    .hidden { display: none !important; }
     /* Level designer */
     #editor { position: fixed; inset: 0; pointer-events: none; }
     #editor > * { pointer-events: auto; }
     #editor-panel { top: 12px; right: 12px; bottom: 12px; width: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
     #editor-panel h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: 0.5px; }
     #editor-panel h2 { margin: 10px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.65; }
     #editor-panel .field { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
     #editor-panel input, #editor-panel select, #editor-panel textarea { background: rgba(255, 255, 255, 0.08); color: inherit; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 4px; padding: 3px 6px; font: inherit; font-size: 13px; }
     #editor-panel .field input, #editor-panel .field select { width: 110px; }
     #editor-panel .field input[type=checkbox] { width: auto; }
     #editor-panel textarea { width: 100%; box-sizing: border-box; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
     #editor-panel .row { display: flex; gap: 6px; flex-wrap: wrap; }
     #editor-panel .row > * { flex: 1; min-width: 0; }
     #editor-panel .row input[type=number] { width: 0; }
     #editor-panel .info { font-size: 12px; opacity: 0.75; line-height: 1.4; }
     #editor-panel .status { font-size: 12px; padding: 6px 8px; border-radius: 6px; background: rgba(255, 215, 90, 0.15); border: 1px solid rgba(255, 215, 90, 0.4); }
     .editor-tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
     .editor-tools .tool { flex-direction: row; justify-content: flex-start; gap: 6px; min-width: 0; padding: 5px 8px; font-size: 13px; }
     .editor-tools .tool .swatch { width: 16px; height: 16px; margin-bottom: 0; flex: none; border: 1px solid rgba(255, 255, 255, 0.25); }
     .editor-tools .tool .count { margin-left: auto; }
     .btn.primary { background: #ffd75a; color: #1c2431; border-color: #ffd75a; font-weight: 600; }
     #editor-hint { bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: 0.9; white-space: nowrap; max-width: calc(100vw - 360px); overflow: hidden; text-overflow: ellipsis; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
   <div id="editor" class="hidden"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
