<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1e1e2e">
  <title>Physical Visualizer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/192.png">
  <link rel="apple-touch-icon" href="./assets/icons/192.png">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/chrome.css">
</head>
<body>
  <canvas id="vis" aria-hidden="true"></canvas>

  <!-- Debug HUD: every signal as a live sparkline. Toggle with ~ -->
  <canvas id="hud" hidden aria-hidden="true"></canvas>

  <!-- First-run gate: this click creates the AudioContext AND requests motion permission -->
  <div id="wake" class="plate" role="button" tabindex="0" aria-label="Start the visualizer">
    <div class="plate-title">▶ CLICK TO WAKE</div>
    <p class="plate-sub">Audio + motion sensors start on this tap.</p>
    <p class="plate-warn">⚠ Contains flashing imagery. A photosensitivity guard limits flash rate and cannot be
      disabled, but if you are sensitive to flashing lights, do not continue.</p>
  </div>

  <!-- Chrome (temporary DOM transport; replaced by skinned windows in Phase 5) -->
  <div id="chrome" class="chrome">
    <div class="title"><span id="marquee">Physical Visualizer</span></div>
    <div class="row">
      <button id="btn-prev-track" aria-label="Previous track">⏮</button>
      <button id="btn-play" aria-label="Play or pause">▶</button>
      <button id="btn-next-track" aria-label="Next track">⏭</button>
      <span id="time" class="time" aria-hidden="true">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <button id="btn-open" aria-label="Open audio files">📂</button>
      <button id="btn-mic" aria-label="Use microphone">🎤</button>
    </div>
    <div class="row">
      <button id="btn-prev-preset" aria-label="Previous preset">◀</button>
      <span id="preset-name" class="preset-name">—</span>
      <button id="btn-next-preset" aria-label="Next preset">▶</button>
      <button id="btn-random" aria-label="Random preset">🎲</button>
      <button id="btn-fs" aria-label="Toggle fullscreen">⛶</button>
      <button id="btn-hud" aria-label="Toggle signal HUD">~</button>
      <button id="btn-install" hidden>Install</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <input type="file" id="file" accept="audio/*" multiple hidden>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
