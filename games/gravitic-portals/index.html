<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gravitic Portals — Phase 1</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: #d8dee9;
      font-family: system-ui, sans-serif; }
    #hud { position: absolute; top: 8px; left: 8px; width: 290px; max-height: calc(100vh - 16px);
      overflow: auto; background: rgba(12, 16, 26, 0.88); padding: 10px; border-radius: 6px; font-size: 12px; }
    #hud h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #8fbcbb; }
    #hud label { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 3px 0; }
    #hud input[type=range] { width: 140px; }
    #hud .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
    #hud button { margin: 4px 4px 0 0; }
    #stats { white-space: pre; font-family: ui-monospace, monospace; font-size: 11px; color: #a3be8c; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud"></div>
  <script type="module" src="./src/app/main.js"></script>
</body>
</html>
